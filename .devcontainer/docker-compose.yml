# Docker Compose for dYdX Trading Bot Development
version: '3.8'

services:
  # Main development container
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: dydx-trading-bot-dev
    volumes:
      # Mount the entire workspace
      - ..:/workspace:cached
      # Persist extensions and settings
      - vscode-extensions:/home/vscode/.vscode-server/extensions
      - vscode-settings:/home/vscode/.vscode-server
      # Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Git configuration
      - ~/.gitconfig:/home/vscode/.gitconfig:ro
      - ~/.ssh:/home/vscode/.ssh:ro
    ports:
      - "8000:8000"   # Development server
      - "8080:8080"   # Alternative web server
      - "9000:9000"   # Grafana
      - "3100:3100"   # Loki
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    working_dir: /workspace
    command: sleep infinity
    networks:
      - dydx-dev-network

  # Optional: Database for development/testing
  postgres-dev:
    image: postgres:15-alpine
    container_name: dydx-postgres-dev
    environment:
      POSTGRES_DB: dydx_trading_dev
      POSTGRES_USER: dydx_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - dydx-dev-network
    profiles:
      - with-db

  # Optional: Redis for caching/session storage
  redis-dev:
    image: redis:7-alpine
    container_name: dydx-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - dydx-dev-network
    profiles:
      - with-redis

  # Optional: Grafana for monitoring
  grafana-dev:
    image: grafana/grafana:latest
    container_name: dydx-grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=dev123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-dev-data:/var/lib/grafana
    networks:
      - dydx-dev-network
    profiles:
      - with-monitoring

  # Optional: Loki for log aggregation
  loki-dev:
    image: grafana/loki:latest
    container_name: dydx-loki-dev
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-dev-data:/tmp/loki
    networks:
      - dydx-dev-network
    profiles:
      - with-monitoring

networks:
  dydx-dev-network:
    driver: bridge

volumes:
  vscode-extensions:
  vscode-settings:
  postgres-dev-data:
  redis-dev-data:
  grafana-dev-data:
  loki-dev-data: