name: Bot Quality

on:
    push:
        branches:
            - master
            - main
        paths:
            - "bot/**"
            - "frontend/**"
            - "backend/**"
            - "docs/**"
            - "README.md"
            - "deploy/k8s-next/**"
            - "deploy/k8s/**"
            - "docker-compose.infra.yml"
            - "docker-compose.stack.yml"
            - "scripts/check_no_plaintext_k8s_secrets.py"
            - ".github/workflows/bot-quality.yml"
    pull_request:
        branches:
            - master
            - main
        paths:
            - "bot/**"
            - "frontend/**"
            - "backend/**"
            - "docs/**"
            - "README.md"
            - "deploy/k8s-next/**"
            - "deploy/k8s/**"
            - "docker-compose.infra.yml"
            - "docker-compose.stack.yml"
            - "scripts/check_no_plaintext_k8s_secrets.py"
            - ".github/workflows/bot-quality.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: bot-quality-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ---------------------------------------------------------------------------
    # Python bot unit tests
    # ---------------------------------------------------------------------------
    bot-tests:
        name: Bot unit tests (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        env:
            APP_RUN_CONFIG_FILE: ${{ github.workspace }}/.ci-run.json
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12"]
        defaults:
            run:
                working-directory: bot

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
                  cache-dependency-path: bot/requirements.txt

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Prepare CI runtime config
              run: |
                  set -euo pipefail
                  cat > "$APP_RUN_CONFIG_FILE" <<'JSON'
                  {
                    "shared": {
                      "APP_ENV": "development",
                      "ENVIRONMENT": "development"
                    },
                    "redis": {
                      "REDIS_ENABLED": false,
                      "REDIS_HOST": "localhost",
                      "REDIS_PORT": 6379,
                      "REDIS_DB": 0,
                      "REDIS_SSL": false
                    }
                  }
                  JSON

            - name: Run bot tests
              run: |
                  set -euo pipefail
                  unset DB_TYPE BOT_DB_TYPE DATABASE_URL BOT_DATABASE_URL
                  unset DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD
                  unset BOT_DB_HOST BOT_DB_PORT BOT_DB_NAME BOT_DB_USER BOT_DB_PASSWORD
                  unset MYSQL_HOST MYSQL_PORT MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD
                  python -m pytest tests/ -v --tb=short \
                    --ignore=tests/test_api_database_integration.py \
                    --ignore=tests/test_comprehensive.py \
                    --cov=src \
                    --cov-fail-under=82 \
                    --cov-report=term \
                    --cov-report=xml:coverage.xml \
                    --cov-report=html:htmlcov \
                    -q 2>&1 | tee pytest-output.txt
                  # Summarise results for the step summary
                  tail -3 pytest-output.txt >> "$GITHUB_STEP_SUMMARY"

            # Coverage FLOOR (blocking): --cov-fail-under=82, ratcheted 2026-08-20
            # from a measured 83.25% line coverage (exact CI invocation, local infra)
            # minus a 1-point ratchet margin. Trail: 64 (2026-08-15, 65.08) -> 68
            # (2026-08-17, 69.30, pure-module hotspots) -> 70 (2026-08-17, 71.98,
            # NATS consumer-service + Celery backtest-task suites; fixed the nats-py
            # RetentionPolicy enum lookup and a None delivery_info eager-task crash)
            # -> 73 (2026-08-18, 74.42, BacktestService unit-seam suite driving the
            # persistence/control/heartbeat/recovery spans + Telegram notifications
            # transport suite; fixed an uncaught ValueError when TELEGRAM_SEND_RETRIES
            # holds a non-integer value) -> 75 (2026-08-19, 76.37, BotInstanceManager
            # lifecycle suite covering stop/delete/auto-recover/external-psutil/
            # DB-recovery seams; fixed delete-of-active-runtime deadlocking on the
            # per-instance lifecycle lock) -> 77 (2026-08-19, 78.09, backtest
            # route-family suite covering all 31 handlers via pinned compat
            # namespaces + stub services; hardened _build_backtest_analytics_summary
            # against non-dict analytics) -> 78 (2026-08-19, 79.60, API server
            # startup/lifespan suite: lifespan context manager with faked Celery/
            # DB/broadcast-bus/manager seams, runtime preflight guardrails, trace
            # middleware, rate limiters incl. redis fallback, markets cache
            # fresh/stale/disabled, and the diagnostics helpers) -> 81 (2026-08-19,
            # 82.10, persistence pair: scripted fake-session suite for every
            # repository incl. analytics mirroring and the UnitOfWork contract,
            # plus pool-monitor/config-projection/manager-lifecycle seams for
            # database.py; no product change) -> 82 (2026-08-20, 83.25, websocket
            # sender-family suite: connection lifecycle incl. mixed-outcome
            # broadcast drops, all realtime loaders (initial_state/positions/
            # stats/market_data) with unknown-bot and loader-error branches,
            # backtest status/log senders incl. not-found and per-send failure
            # paths, WebSocketEvents + module broadcast helpers, and the full
            # send-failure metrics matrix; no product change). Ratchet upward as
            # coverage improves; never
            # lower without a documented justification. pytest-cov and coverage are
            # pulled in via requirements.txt; config lives in bot/pyproject.toml
            # ([tool.coverage.*]); source root is src.
            - name: Publish coverage summary
              if: always()
              run: |
                  python - <<'EOF'
                  import os
                  import xml.etree.ElementTree as ET

                  path = "coverage.xml"
                  summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
                  if not os.path.exists(path):
                      msg = "### 📊 Test coverage\n\ncoverage.xml not found — did the test step run?"
                  else:
                      root = ET.parse(path).getroot()
                      line_rate = float(root.attrib.get("line-rate", 0)) * 100
                      branch_rate = float(root.attrib.get("branch-rate", 0)) * 100
                      lines_valid = int(root.attrib.get("lines-valid", 0))
                      lines_covered = int(root.attrib.get("lines-covered", 0))
                      msg = (
                          "### 📊 Test coverage\n\n"
                          "| Metric | Value |\n| --- | --- |\n"
                          f"| Line coverage | **{line_rate:.1f}%** ({lines_covered}/{lines_valid}) |\n"
                          f"| Branch coverage | {branch_rate:.1f}% |\n\n"
                          "Download the **coverage-report** artifact and open `htmlcov/index.html` "
                          "for the full line-by-line report."
                      )
                  print(msg)
                  if summary:
                      with open(summary, "a") as fh:
                          fh.write(msg + "\n")
                  EOF

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: |
                      bot/coverage.xml
                      bot/htmlcov
                  if-no-files-found: warn
                  retention-days: 14

    # ---------------------------------------------------------------------------
    # Bot lint — Black formatting + flake8 hard gate
    # ---------------------------------------------------------------------------
    bot-lint:
        name: Bot lint (isort + Black + flake8)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: bot

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Install lint tools
              # Pinned to match bot/requirements.txt (black==26.5.1, isort==6.0.1,
              # flake8==7.3.0). Keep these in sync when bumping the requirements.txt pins.
              run: pip install black==26.5.1 isort==6.0.1 flake8==7.3.0

            - name: isort import-order gate
              # Fails on import-order drift. Config (profile=black, line-length 88)
              # is read from bot/pyproject.toml [tool.isort] — identical to
              # local/pre-commit.
              run: isort --check-only --diff src tests

            - name: Black formatting gate
              # Fails on formatting drift. Config (line-length=88, py312) is read
              # from bot/pyproject.toml [tool.black] — identical to local/pre-commit.
              run: black --check --diff src tests

            - name: flake8 hard gate
              # Syntax errors + undefined names only — the same selection the
              # pre-commit hook enforces.
              run: flake8 src tests --select=E9,F63,F7,F82 --show-source

    # ---------------------------------------------------------------------------
    # Bot type checking (mypy) — BLOCKING gate (baseline cleared 2026-08-16)
    # ---------------------------------------------------------------------------
    # The codebase predates type annotations; the type debt was cleared
    # module-by-module (234 errors → 0, measured 2026-08-16) and this job now
    # gates merges:
    #   - any new mypy error fails the build;
    #   - the job is in the quality-gate `needs`.
    # Config lives in bot/pyproject.toml ([tool.mypy]); phase-2 options
    # (check_untyped_defs, warn_unused_ignores, warn_redundant_casts) are enabled
    # there — the commented phase-3 options are the next tightening step.
    bot-typecheck:
        name: Bot type check (mypy)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: bot
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: bot/requirements.txt

            - name: Install dependencies
              # Install the FULL requirements.txt (not just mypy) so mypy sees the
              # same typed deps as locally — sqlalchemy/fastapi/pydantic/celery ship
              # inline types (py.typed). Installing only mypy + stubs would make
              # mypy ignore those imports and report a different, lower baseline.
              run: pip install -r requirements.txt

            - name: Run mypy
              run: |
                  set -o pipefail
                  python -m mypy --no-color src 2>&1 | tee mypy-output.txt

            - name: Publish mypy summary
              if: always()
              run: |
                  echo "### 🔍 Type checking (mypy — blocking gate)" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Baseline cleared 2026-08-16 (234 → 0); any error now fails the build." >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f mypy-output.txt ]; then
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -5 mypy-output.txt >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  fi

    # ---------------------------------------------------------------------------
    # Bandit security scan (non-blocking, phase 1 — mirrors bot-typecheck/mypy)
    # ---------------------------------------------------------------------------
    bot-security:
        name: Bot security scan (bandit)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: bot
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: bot/requirements.txt

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run bandit
              continue-on-error: true # phase 1: reporting-only, does not gate
              run: |
                  set -o pipefail
                  python -m bandit -r src -c pyproject.toml -ll 2>&1 | tee bandit-output.txt

            - name: Publish bandit summary
              if: always()
              run: |
                  echo "### 🛡️ Security scanning (bandit — phase 1, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Reporting-only (medium+high severity via \`-ll\`). Drive issues to 0, then flip this job to a gate (see bot/pyproject.toml)." >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f bandit-output.txt ]; then
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -20 bandit-output.txt >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  fi

    # ---------------------------------------------------------------------------
    # Dependency vulnerability scan (pip-audit) — phase 1: NON-BLOCKING
    # ---------------------------------------------------------------------------
    # bandit scans our code; pip-audit scans the DEPENDENCY TREE against the
    # PyPI advisory database — for a service that holds exchange signing keys,
    # the dependency surface is part of the attack surface. Audits the resolved
    # bot/requirements.txt in an isolated environment (no full install needed).
    # Phase 1 non-blocking (mirrors bot-security/bandit): findings are reported
    # to the job summary without gating. Known accepted finding: the transitive
    # `ecdsa` advisory via python-jose has no fix release (upstream is dormant);
    # promote this job to a gate once triage policy for such cases is decided.
    # (2026-08-15: the unused aiohttp pin was removed, clearing its 3 open
    # advisories at the root.)
    bot-deps-audit:
        name: Bot dependency audit (pip-audit)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: bot
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: bot/requirements.txt

            - name: Install pip-audit
              # Only the scanner; the audit itself resolves requirements.txt in
              # isolation. Pinned to match bot/requirements.txt.
              run: pip install pip-audit==2.10.1

            - name: Audit dependencies
              continue-on-error: true # phase 1: reporting-only, does not gate
              run: |
                  set -o pipefail
                  pip-audit -r requirements.txt --progress-spinner off 2>&1 | tee deps-audit-output.txt

            - name: Publish dependency audit summary
              if: always()
              run: |
                  echo "### 📦 Dependency audit (pip-audit — phase 1, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Resolved bot/requirements.txt tree vs the PyPI advisory DB. Reporting-only; promote to a gate after triage policy is decided (see workflow comments)." >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f deps-audit-output.txt ]; then
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -20 deps-audit-output.txt >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  fi

    # ---------------------------------------------------------------------------
    # Multi-worker broadcast integration test — real Postgres + Valkey topology
    # ---------------------------------------------------------------------------
    # Runs the opt-in harness (tests/test_multi_worker_broadcast.py, the same
    # suite as `make test-multiworker`) against service containers: it boots the
    # canonical API as TWO real worker processes sharing one Redis/Valkey and an
    # ephemeral PostgreSQL database with WS_BROADCAST_ENABLED=true, and asserts
    # that a broadcast on worker A reaches a WebSocket client on worker B exactly
    # once with no loop-back, plus a burst/load scenario (multi-channel burst,
    # both publish directions, exactly-once + per-channel order + zero listener
    # reconnects). This is the coverage that gates flipping the broadcast bus
    # default ON (Phase 2) and it has already caught a real listener-flap bug
    # in the Phase 1 bus.
    # Promoted to a BLOCKING gate 2026-08-16. IMPORTANT: the earlier phase-1
    # "green" job conclusions were misleading — `continue-on-error` marked the
    # job success even though the pytest step never actually passed in CI (it
    # errored on the missing .configkey.bin while decrypting the encrypted
    # profile). Promotion exposed that; the job now carries a hermetic
    # APP_RUN_CONFIG_FILE (mirroring bot-tests) and genuinely runs the suite.
    # If shared-runner flakiness appears, triage via MULTIWORKER_BURST_MESSAGES
    # without un-promoting the job.
    bot-multiworker:
        name: Bot multi-worker broadcast test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                # Same image/credentials as docker-compose.infra.yml defaults so
                # the harness's POSTGRES_* probes match local runs exactly.
                image: postgres:15.18-bookworm
                env:
                    POSTGRES_USER: dydx_bot
                    POSTGRES_PASSWORD: change-me-db-password
                    POSTGRES_DB: dydx_bot
                ports:
                    - 127.0.0.1:5432:5432
                options: >-
                    --health-cmd "pg_isready -U dydx_bot -d dydx_bot"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
            valkey:
                image: valkey/valkey:7.2-alpine
                ports:
                    - 127.0.0.1:6379:6379
                options: >-
                    --health-cmd "valkey-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            MULTIWORKER_TEST: "1"
            MULTIWORKER_REDIS_URL: redis://127.0.0.1:6379/0
            POSTGRES_HOST: 127.0.0.1
            POSTGRES_PORT: "5432"
            POSTGRES_USER: dydx_bot
            POSTGRES_PASSWORD: change-me-db-password
            # Hermetic runtime config (mirrors bot-tests): without this the
            # pytest process tries to decrypt config/profiles/*.config.enc.json
            # and fails on the missing .configkey.bin (repo secret).
            APP_RUN_CONFIG_FILE: ${{ github.workspace }}/.ci-run.json
        defaults:
            run:
                working-directory: bot

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: bot/requirements.txt

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Prepare CI runtime config
              run: |
                  cat > "$APP_RUN_CONFIG_FILE" <<'JSON'
                  {
                    "shared": {
                      "APP_ENV": "development",
                      "ENVIRONMENT": "development"
                    },
                    "redis": {
                      "REDIS_ENABLED": false,
                      "REDIS_HOST": "localhost",
                      "REDIS_PORT": 6379,
                      "REDIS_DB": 0,
                      "REDIS_SSL": false
                    }
                  }
                  JSON

            - name: Run multi-worker broadcast test
              # -s so the harness's worker log tails (printed on failure) and
              # skip reasons surface in the CI log.
              run: |
                  set -o pipefail
                  python -m pytest tests/test_multi_worker_broadcast.py -vv -s --tb=short 2>&1 | tee multiworker-output.txt

            - name: Publish multi-worker summary
              if: always()
              run: |
                  echo "### 🔗 Multi-worker broadcast test (blocking gate)" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Two real API workers + Redis + ephemeral Postgres, incl. the burst/load scenario (\`tests/test_multi_worker_broadcast.py\`)." >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f multiworker-output.txt ]; then
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -6 multiworker-output.txt >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  fi

    # ---------------------------------------------------------------------------
    # External-service integration tests (Redis/Valkey, Celery, dYdX indexer)
    # ---------------------------------------------------------------------------
    # Runs the opt-in harness (tests/test_integration_external_services.py, the
    # same suite as `make test-integration`) against a Valkey service container
    # and the live public dYdX v4 indexer: the real shared L2 market-data cache,
    # real broadcast-bus pub/sub, a real Celery worker subprocess answering
    # control pings + registering the project's tasks, and the indexer's public
    # markets contract. Redis scratch DBs 14/15 keep the run isolated; the dYdX
    # test skips (not fails) when outbound network is unavailable.
    # Promoted to a BLOCKING gate 2026-08-16 alongside bot-multiworker. Note:
    # the earlier phase-1 "green" conclusions were misleading for the same
    # reason (continue-on-error masked the never-actually-green pytest step);
    # the job now carries a hermetic APP_RUN_CONFIG_FILE. The indexer contract
    # still skips (not fails) when outbound network is unavailable, so the gate
    # is offline-safe.
    bot-integration:
        name: Bot external-service integration tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            valkey:
                image: valkey/valkey:7.2-alpine
                ports:
                    - 127.0.0.1:6379:6379
                options: >-
                    --health-cmd "valkey-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            INTEGRATION_TEST: "1"
            # Hermetic runtime config (mirrors bot-tests): without this the
            # pytest process tries to decrypt config/profiles/*.config.enc.json
            # and fails on the missing .configkey.bin (repo secret).
            APP_RUN_CONFIG_FILE: ${{ github.workspace }}/.ci-run.json
        defaults:
            run:
                working-directory: bot

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: bot/requirements.txt

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Prepare CI runtime config
              run: |
                  cat > "$APP_RUN_CONFIG_FILE" <<'JSON'
                  {
                    "shared": {
                      "APP_ENV": "development",
                      "ENVIRONMENT": "development"
                    },
                    "redis": {
                      "REDIS_ENABLED": false,
                      "REDIS_HOST": "localhost",
                      "REDIS_PORT": 6379,
                      "REDIS_DB": 0,
                      "REDIS_SSL": false
                    }
                  }
                  JSON

            - name: Run external-service integration tests
              run: |
                  set -o pipefail
                  python -m pytest tests/test_integration_external_services.py -vv -s --tb=short 2>&1 | tee integration-output.txt

            - name: Publish integration summary
              if: always()
              run: |
                  echo "### 🌐 External-service integration tests (blocking gate)" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Real Redis/Valkey cache + pub/sub, a real Celery worker, and the public dYdX indexer (\`tests/test_integration_external_services.py\`)." >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f integration-output.txt ]; then
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -6 integration-output.txt >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  fi

    # ---------------------------------------------------------------------------
    # K8s plaintext secret scanner
    # ---------------------------------------------------------------------------
    k8s-secret-scan:
        name: K8s plaintext secret scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Scan k8s manifests for plaintext secrets
              run: |
                  set -euo pipefail
                  python3 scripts/check_no_plaintext_k8s_secrets.py
                  echo "No plaintext secrets detected in k8s manifests." >> "$GITHUB_STEP_SUMMARY"

    # ---------------------------------------------------------------------------
    # Docker Compose validation (local dev infrastructure)
    # ---------------------------------------------------------------------------
    docker-compose-validate:
        name: Docker Compose validation
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Validate infra compose file syntax
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.infra.yml config > /dev/null
                  echo "docker-compose.infra.yml: OK" >> "$GITHUB_STEP_SUMMARY"

            - name: Validate stack compose file syntax
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.stack.yml config > /dev/null
                  echo "docker-compose.stack.yml: OK" >> "$GITHUB_STEP_SUMMARY"

            - name: Check required services in infra compose
              run: |
                  set -euo pipefail
                  required_services=("postgresql" "valkey" "nats" "clickhouse" "minio")
                  for service in "${required_services[@]}"; do
                    if ! grep -q "^  $service:" docker-compose.infra.yml; then
                      echo "ERROR: Required service '$service' not found in docker-compose.infra.yml" >&2
                      exit 1
                    fi
                  done
                  echo "All required infra services present" >> "$GITHUB_STEP_SUMMARY"

            - name: Check required services in stack compose
              run: |
                  set -euo pipefail
                  required_services=("frontend" "backend-api" "bot-api" "bot-worker" "postgresql" "valkey" "nats" "clickhouse" "minio")
                  for service in "${required_services[@]}"; do
                    if ! grep -q "^  $service:" docker-compose.stack.yml; then
                      echo "ERROR: Required service '$service' not found in docker-compose.stack.yml" >&2
                      exit 1
                    fi
                  done
                  echo "All required stack services present" >> "$GITHUB_STEP_SUMMARY"

    # ---------------------------------------------------------------------------
    # Kustomize build validation (base + overlays)
    # ---------------------------------------------------------------------------
    kustomize-validate:
        name: Kustomize build validation
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install kustomize
              run: |
                  set -euo pipefail
                  curl -sSL \
                    "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
                    | tar -xz -C /usr/local/bin kustomize
                  kustomize version

            - name: Validate base
              run: |
                  set -euo pipefail
                  kustomize build --load-restrictor=LoadRestrictionsNone deploy/k8s-next/base > /dev/null
                  echo "Base build: OK" >> "$GITHUB_STEP_SUMMARY"

            - name: Validate staging overlay
              run: |
                  set -euo pipefail
                  kustomize build --load-restrictor=LoadRestrictionsNone deploy/k8s-next/overlays/staging > /dev/null
                  echo "Staging overlay build: OK" >> "$GITHUB_STEP_SUMMARY"

            - name: Validate production overlay
              run: |
                  set -euo pipefail
                  kustomize build --load-restrictor=LoadRestrictionsNone deploy/k8s-next/overlays/production > /dev/null
                  echo "Production overlay build: OK" >> "$GITHUB_STEP_SUMMARY"

    # ---------------------------------------------------------------------------
    # Gate — all checks must pass
    # ---------------------------------------------------------------------------
    backend-tests:
        name: Backend tests (Go)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                # Enables the env-gated Postgres critical-path harness
                # (POSTGRES_TEST_DSN) that guards placeholder/argument drift —
                # the bug class sqlite/sqlmock tests cannot catch.
                image: postgres:15.18-bookworm
                env:
                    POSTGRES_USER: dydx_bot
                    POSTGRES_PASSWORD: change-me-db-password
                    POSTGRES_DB: dydx_bot
                ports:
                    - 127.0.0.1:5432:5432
                options: >-
                    --health-cmd "pg_isready -U dydx_bot -d dydx_bot"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            POSTGRES_TEST_DSN: postgres://dydx_bot:change-me-db-password@127.0.0.1:5432/dydx_bot?sslmode=disable
        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: backend/go.mod
                  cache: true
                  cache-dependency-path: backend/go.sum

            - name: Build
              run: go build ./...

            - name: Vet
              run: go vet ./... && go vet -tags integration ./internal/routes/

            - name: Unit tests
              run: go test -race -count=1 ./...

    # ---------------------------------------------------------------------------
    # Frontend quality — lint + typecheck + contract tests + build
    # ---------------------------------------------------------------------------
    # frontend/.github/workflows/ci.yml is NOT executed by GitHub Actions (only
    # repo-root .github/workflows/ is loaded), so this root job is the effective
    # frontend gate. Commands mirror frontend/package.json scripts exactly.
    frontend-quality:
        name: Frontend quality (lint + typecheck + contracts + build)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            # vite.config.ts loads the structured config at startup; without a
            # plain run-config file it tries to decrypt config/profiles with
            # the repo-secret .configkey.bin (absent on CI runners). Same
            # hermetic mechanism as the bot jobs.
            APP_RUN_CONFIG_FILE: ${{ github.workspace }}/.ci-run.json
        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Prepare CI runtime config
              run: |
                  cat > "$APP_RUN_CONFIG_FILE" <<'JSON'
                  {
                    "shared": {
                      "APP_ENV": "development",
                      "ENVIRONMENT": "development"
                    }
                  }
                  JSON

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Unit and contract tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: E2E smoke tests (Playwright)
              run: npm run test:e2e

    # ---------------------------------------------------------------------------
    # Documentation governance (canonical docs + link validation)
    # ---------------------------------------------------------------------------
    docs-governance:
        name: Docs governance (canonical tree + links)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Validate canonical docs and links
              run: |
                  set -euo pipefail
                  python3 scripts/validate_docs_governance.py
                  echo "Docs governance validated." >> "$GITHUB_STEP_SUMMARY"

    # ---------------------------------------------------------------------------
    # golangci-lint — phase 1: NON-BLOCKING
    # ---------------------------------------------------------------------------
    # The repo's full .golangci.yml (v2) currently reports ~2.1k findings
    # (largely errcheck style). Reporting-only mirrors bandit/pip-audit phase
    # precedent; drive findings down (or tune the config) and then promote
    # this job into the quality-gate needs.
    backend-lint:
        name: Backend lint (golangci-lint, phase 1)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: backend/go.mod
                  cache: true
                  cache-dependency-path: backend/go.sum

            - name: Install golangci-lint
              run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0

            - name: Run golangci-lint
              continue-on-error: true # phase 1: reporting-only, does not gate
              run: |
                  set -o pipefail
                  golangci-lint run ./... 2>&1 | tee golangci-output.txt

            - name: Publish lint summary
              if: always()
              run: |
                  echo "### 🧹 Backend lint (golangci-lint — phase 1, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f golangci-output.txt ]; then
                    echo '```' >> "$GITHUB_STEP_SUMMARY"
                    tail -20 golangci-output.txt >> "$GITHUB_STEP_SUMMARY"
                    echo '```' >> "$GITHUB_STEP_SUMMARY"
                  fi

    quality-gate:
        name: Quality gate
        runs-on: ubuntu-latest
        needs:
            - bot-tests
            - bot-lint
            - docs-governance
            - bot-typecheck
            - bot-multiworker
            - bot-integration
            - backend-tests
            - frontend-quality
            - docker-compose-validate
            - k8s-secret-scan
            - kustomize-validate
        if: always()

        steps:
            - name: Assert all checks passed
              run: |
                  set -euo pipefail
                  results='${{ toJSON(needs) }}'
                  echo "Job results: $results"
                  if echo "$results" | grep -q '"result": "failure"'; then
                    echo "One or more quality checks failed." >&2
                    exit 1
                  fi
                  if echo "$results" | grep -q '"result": "cancelled"'; then
                    echo "One or more quality checks were cancelled." >&2
                    exit 1
                  fi
                  echo "All quality checks passed." >> "$GITHUB_STEP_SUMMARY"
