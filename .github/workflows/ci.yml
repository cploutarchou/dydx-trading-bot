name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: |
                      bot/requirements.txt

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  python -m pip install -r bot/requirements.txt
                  python -m pip install pytest flake8 pylint

            - name: Prepare shared env for validation
              run: cp .env.example .env

            - name: Validate stack environment template
              run: python scripts/validate_stack_env.py

            - name: Lint diagnostics (pylint metadata)
              run: |
                  python --version
                  pylint --version
                  pylint --list-msgs | grep -E "^(R1714|R1705|R0801):" || true

            - name: Run linting
              run: |
                  flake8 bot/src bot/tests scripts --max-line-length=120 --exclude=__pycache__ || echo "⚠️ flake8 issues found; continuing"
                  pylint bot/src --disable=C0111,W0212 || true

            - name: Run regression tests
              run: python -m pytest bot/tests/test_bot_agent_emergency_cleanup.py -v --tb=short
              env:
                  PYTHONPATH: ${{ github.workspace }}/bot

    backend-ws-smoke:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23"

            - name: Run delegated websocket smoke tests
              working-directory: backend
              run: go test -v ./internal/routes -run '^TestSmoke_.*WS$'

    docker-prereqs:
        runs-on: ubuntu-latest
        outputs:
            root_dockerfile: ${{ steps.check.outputs.root_dockerfile }}
        steps:
            - uses: actions/checkout@v4

            - name: Detect root Dockerfile
              id: check
              shell: bash
              run: |
                  if [[ -f Dockerfile ]]; then
                      echo "root_dockerfile=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "root_dockerfile=false" >> "$GITHUB_OUTPUT"
                  fi

    docker:
        runs-on: ubuntu-latest
        needs:
            - test
            - backend-ws-smoke
            - docker-prereqs
        if: needs.docker-prereqs.outputs.root_dockerfile == 'true'
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              run: |
                  docker build -t dydx-trading-bot:test --target production .

            - name: Test Docker image
              run: |
                  # Smoke-test importability of API app in production image
                  docker run --rm \
                    -e PYTHONPATH=/app \
                    dydx-trading-bot:test \
                    python -c "from src.api.server import app; print('API title:', app.title)"
