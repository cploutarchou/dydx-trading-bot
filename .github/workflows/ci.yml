name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ python3-dev pkg-config
      
      - name: Setup environment
        run: make setup
      
      - name: Install dependencies
        run: make install
      
      - name: Create test config
        run: |
          make config
          # Replace with test values to avoid using real credentials
          sed -i 's/dydx1ENTERYOURTESTADDRESS/dydx1testaddress123/g' app/config.yaml
          sed -i 's/word1 word2 word3.*/test seed phrase for ci testing only not real/g' app/config.yaml
          sed -i 's/5860211111:AAGABUQiYet.*/test_telegram_token/g' app/config.yaml
          sed -i 's/5236746578/test_chat_id/g' app/config.yaml
          sed -i 's/enabled: false/enabled: false/g' app/config.yaml
      
      - name: Run linting (allow failures for now)
        run: make lint || echo "⚠️ Linting issues found, but continuing CI"
      
      - name: Run tests
        run: make test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create test config for Docker
        run: |
          make config
          # Replace with test values for Docker build
          sed -i 's/dydx1ENTERYOURTESTADDRESS/dydx1testaddress123/g' app/config.yaml
          sed -i 's/word1 word2 word3.*/test seed phrase for ci testing only not real/g' app/config.yaml
      
      - name: Build Docker image
        run: |
          docker build -t dydx-trading-bot:test --target production .
      
      - name: Test Docker image
        run: |
          # Test that the image runs and exits cleanly (without actual trading)
          docker run --rm \
            -v $(pwd)/app/config.yaml:/app/app/config.yaml:ro \
            -e PYTHONPATH=/app/app \
            dydx-trading-bot:test python -c "
          print('🐳 Testing Docker environment...')
          try:
              from config import ConfigurationManager
              config = ConfigurationManager.get_config()
              print('✅ Configuration loaded successfully')
              print(f'Environment: {getattr(config, \"environment\", \"development\")}')
              print(f'Is testnet: {config.is_testnet}')
              from logging_setup import setup_logging
              setup_logging()
              print('✅ Logging initialized successfully')
              import constants
              print('✅ Constants imported successfully')
              print('🎉 Docker environment test completed successfully!')
          except Exception as e:
              print(f'❌ Docker test failed: {e}')
              import traceback
              traceback.print_exc()
              exit(1)
          "
