name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    devcontainer-consistency:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"

            - name: Validate devcontainer consistency
              run: python scripts/check_devcontainer_consistency.py

    test:
        runs-on: ubuntu-latest
        needs: devcontainer-consistency
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: |
                      bot/requirements.txt

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  python -m pip install -r bot/requirements.txt
                  python -m pip install pytest flake8 pylint

            - name: Prepare stack env for validation
              run: cp .env.stack.example .env.stack

            - name: Validate stack environment template
              run: python scripts/validate_stack_env.py

            - name: Lint diagnostics (pylint metadata)
              run: |
                  python --version
                  pylint --version
                  pylint --list-msgs | grep -E "^(R1714|R1705|R0801):" || true

            - name: Run linting
              run: |
                  flake8 bot/src scripts tests --max-line-length=120 --exclude=__pycache__ || echo "⚠️ flake8 issues found; continuing"
                  pylint bot/src --disable=C0111,W0212 || true

            - name: Run regression tests
              run: python -m pytest bot/tests/test_bot_agent_emergency_cleanup.py -v --tb=short
              env:
                  PYTHONPATH: ${{ github.workspace }}/bot

    docker:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              run: |
                  docker build -t dydx-trading-bot:test --target production .

            - name: Test Docker image
              run: |
                  # Smoke-test importability of API app in production image
                  docker run --rm \
                    -e PYTHONPATH=/app \
                    dydx-trading-bot:test \
                    python -c "from src.api.server import app; print('API title:', app.title)"
