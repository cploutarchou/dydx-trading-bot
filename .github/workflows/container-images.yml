name: Build Service Images

on:
    push:
        branches:
            - master
            - main
        paths:
            - "docker/**"
            - "bot/**"
            - "backend/**"
            - "frontend/**"
            - "docker-compose.infra.yml"
            - "docker-compose.stack.yml"
            - ".github/workflows/container-images.yml"
    pull_request:
        branches:
            - master
            - main
        paths:
            - "docker/**"
            - "bot/**"
            - "backend/**"
            - "frontend/**"
            - "docker-compose.infra.yml"
            - "docker-compose.stack.yml"
            - ".github/workflows/container-images.yml"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: container-images-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate-compose:
        name: Validate docker-compose files
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Validate infra compose syntax
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.infra.yml config > /dev/null
                  echo "✓ docker-compose.infra.yml syntax valid"

            - name: Validate stack compose syntax
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.stack.yml config > /dev/null
                  echo "✓ docker-compose.stack.yml syntax valid"

    # Images are published only for commits whose quality gate passed. On a push
    # this job waits for the "Quality gate" check of the same commit (Bot Quality
    # runs for every path this workflow builds from) and fails when the gate
    # fails, is missing, or does not finish in time. Pull requests build without
    # pushing and a manual dispatch is an explicit operator decision, so both
    # pass straight through.
    wait-for-quality-gate:
        name: Wait for quality gate
        runs-on: ubuntu-latest
        permissions:
            checks: read
            contents: read
        steps:
            - name: Wait for the Quality gate check on this commit
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  if [ "${EVENT_NAME}" != "push" ]; then
                    echo "Event ${EVENT_NAME}: nothing is published automatically; not waiting."
                    exit 0
                  fi

                  deadline=$(( $(date +%s) + 45 * 60 ))
                  appear_deadline=$(( $(date +%s) + 10 * 60 ))
                  while true; do
                    result="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?check_name=Quality%20gate" \
                      --jq '[.check_runs[] | {status, conclusion}] | sort_by(.status) | last // empty')"
                    # No check run for this commit yields empty output, not JSON.
                    if [ -z "${result}" ]; then
                      status="missing"
                      conclusion=""
                    else
                      status="$(printf '%s' "${result}" | jq -r '.status')"
                      conclusion="$(printf '%s' "${result}" | jq -r '.conclusion // ""')"
                    fi
                    echo "Quality gate: status=${status} conclusion=${conclusion}"

                    if [ "${status}" = "completed" ]; then
                      if [ "${conclusion}" = "success" ]; then
                        exit 0
                      fi
                      echo "::error::Quality gate concluded '${conclusion}'; images are not published for this commit."
                      exit 1
                    fi
                    now=$(date +%s)
                    if [ "${status}" = "missing" ] && [ "${now}" -ge "${appear_deadline}" ]; then
                      echo "::error::No Quality gate check appeared for ${SHA} within 10 minutes; not publishing."
                      exit 1
                    fi
                    if [ "${now}" -ge "${deadline}" ]; then
                      echo "::error::Quality gate did not finish within 45 minutes; not publishing."
                      exit 1
                    fi
                    sleep 30
                  done

    build-and-publish:
        name: Build ${{ matrix.service }} image
        runs-on: ubuntu-latest
        needs:
            - validate-compose
            - wait-for-quality-gate
        strategy:
            fail-fast: false
            matrix:
                include:
                    - service: api
                      dockerfile: docker/Dockerfile.api
                    - service: worker
                      dockerfile: docker/Dockerfile.worker
                    - service: backend
                      dockerfile: docker/Dockerfile.backend
                    - service: frontend
                      dockerfile: docker/Dockerfile.frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Check active database patterns (advisory)
              id: legacy-db-check
              continue-on-error: true
              run: |
                  set -euo pipefail
                  python3 scripts/check_no_legacy_database.py --mode postgres

            - name: Summarize legacy DB pattern check
              if: always()
              run: |
                  set -euo pipefail
                  if [ "${{ steps.legacy-db-check.outcome }}" = "failure" ]; then
                    echo "⚠️ Legacy database pattern check reported findings (advisory during migration)." >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "✅ Legacy database pattern check passed." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Enforce no legacy MariaDB patterns in stack/image surfaces
              run: |
                  set -euo pipefail
                  python3 scripts/check_no_legacy_database.py \
                    --mode mariadb \
                    --path docker \
                    --path docker-compose.infra.yml \
                    --path docker-compose.stack.yml

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/dydx-trading-bot/${{ matrix.service }}
                  tags: |
                      type=sha,format=short
                      type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}

    image-tag-summary:
        name: Image tag summary
        runs-on: ubuntu-latest
        needs: build-and-publish
        steps:
            - name: Publish image tag summary
              env:
                  OWNER: ${{ github.repository_owner }}
                  EVENT_NAME: ${{ github.event_name }}
                  REF_NAME: ${{ github.ref_name }}
                  SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  short_sha="${SHA:0:7}"
                  image_registry="ghcr.io/${OWNER}/dydx-trading-bot"

                  {
                    echo "## Container image summary"
                    echo
                    if [[ "${EVENT_NAME}" == "pull_request" ]]; then
                      echo "- Event: pull request (images built but not pushed)"
                    else
                      echo "- Event: ${EVENT_NAME}"
                    fi
                    echo "- Branch: ${REF_NAME}"
                    echo "- Commit: ${SHA}"
                    echo
                    echo "### Recommended deploy env"
                    echo
                    echo "- IMAGE_REGISTRY=${image_registry}"
                    echo "- IMAGE_TAG=${short_sha}"
                    echo
                    echo "### Service images"
                    echo
                    echo "- ${image_registry}/api:${short_sha}"
                    echo "- ${image_registry}/worker:${short_sha}"
                    echo "- ${image_registry}/backend:${short_sha}"
                    echo "- ${image_registry}/frontend:${short_sha}"
                    echo
                    echo "> If this run is on the default branch, the images are also tagged as \`latest\`."
                  } >> "$GITHUB_STEP_SUMMARY"
