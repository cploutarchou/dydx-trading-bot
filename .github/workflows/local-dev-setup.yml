name: Local Dev Setup Validation

on:
    push:
        branches:
            - master
            - main
        paths:
            - "docker-compose.infra.yml"
            - "docker-compose.stack.yml"
            - "Makefile"
            - "LOCAL_SETUP_GUIDE.md"
            - ".github/workflows/local-dev-setup.yml"
    pull_request:
        branches:
            - master
            - main
        paths:
            - "docker-compose.infra.yml"
            - "docker-compose.stack.yml"
            - "Makefile"
            - "LOCAL_SETUP_GUIDE.md"
            - ".github/workflows/local-dev-setup.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: local-dev-setup-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # One job on purpose. These checks take a few seconds in total, and every job
    # is billed as a full minute, so four jobs plus a gate cost five minutes for
    # under half a minute of work. Each step runs even when an earlier one fails,
    # so a single run still reports every problem.
    validation-gate:
        name: Validation gate
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Validate docker-compose.infra.yml
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.infra.yml config > /dev/null
                  echo "✓ docker-compose.infra.yml syntax valid"

            - name: Validate docker-compose.stack.yml
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.stack.yml config > /dev/null
                  echo "✓ docker-compose.stack.yml syntax valid"

            - name: Check required Makefile targets exist
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  required_targets=(
                    "help"
                    "infra-up"
                    "infra-down"
                    "infra-ps"
                    "infra-logs"
                    "stack-up-dev"
                    "stack-down"
                    "stack-ps"
                    "stack-logs"
                    "dev"
                    "config-keygen"
                    "dev-config"
                  )

                  for target in "${required_targets[@]}"; do
                    if ! grep -q "^$target:" Makefile; then
                      echo "ERROR: Required Makefile target '$target' not found" >&2
                      exit 1
                    fi
                  done
                  echo "✓ All required Makefile targets present"

            - name: Check LOCAL_SETUP_GUIDE exists and has content
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  if [ ! -f LOCAL_SETUP_GUIDE.md ]; then
                    echo "LOCAL_SETUP_GUIDE.md not found (warning only)." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  if [ ! -s LOCAL_SETUP_GUIDE.md ]; then
                    echo "ERROR: LOCAL_SETUP_GUIDE.md is empty" >&2
                    exit 1
                  fi
                  echo "✓ LOCAL_SETUP_GUIDE.md exists and has content"

            - name: Validate setup guide references key commands
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  if [ ! -f LOCAL_SETUP_GUIDE.md ]; then
                    exit 0
                  fi
                  grep -q "make infra-up" LOCAL_SETUP_GUIDE.md || echo "Warning: missing make infra-up reference" >> "$GITHUB_STEP_SUMMARY"
                  grep -q "make stack-up-dev" LOCAL_SETUP_GUIDE.md || echo "Warning: missing make stack-up-dev reference" >> "$GITHUB_STEP_SUMMARY"
                  echo "✓ Setup guide validation complete"

            - name: Check infra compose has all required services
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  required_services=(
                    "postgresql"
                    "valkey"
                    "nats"
                    "clickhouse"
                    "minio"
                  )

                  for service in "${required_services[@]}"; do
                    if ! grep -q "^  $service:" docker-compose.infra.yml; then
                      echo "ERROR: Required service '$service' not found in docker-compose.infra.yml" >&2
                      exit 1
                    fi
                  done
                  echo "✓ All required infra services configured"

            - name: Check stack compose has all required services
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  required_services=(
                    "frontend"
                    "backend-api"
                    "bot-api"
                    "bot-worker"
                    "postgresql"
                    "valkey"
                    "nats"
                    "clickhouse"
                    "minio"
                  )

                  for service in "${required_services[@]}"; do
                    if ! grep -q "^  $service:" docker-compose.stack.yml; then
                      echo "ERROR: Required service '$service' not found in docker-compose.stack.yml" >&2
                      exit 1
                    fi
                  done
                  echo "✓ All required stack services configured"
