name: Swarmctl Auto Deploy After Image Publish

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-swarmctl-deploy:
    name: Dispatch swarmctl deploy workflow
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main') &&
      github.event.workflow_run.repository.full_name == github.repository
    env:
      TARGET_ENV: ${{ vars.SWARMCTL_AUTO_ENV || 'staging' }}
      TARGET_DEPLOY_INFRA: ${{ vars.SWARMCTL_AUTO_DEPLOY_INFRA || 'false' }}
      TARGET_DEPLOY_APPS: ${{ vars.SWARMCTL_AUTO_DEPLOY_APPS || 'true' }}
      TARGET_DRY_RUN: ${{ vars.SWARMCTL_AUTO_DRY_RUN || 'false' }}
      SWARMCTL_REF: ${{ vars.SWARMCTL_REPO_REF || 'swarmctl-v0.1.22' }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout dydx-trading-bot
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Checkout server-orchestrator
        uses: actions/checkout@v4
        with:
          repository: cploutarchou/server-orchestrator
          ref: ${{ env.SWARMCTL_REF }}
          path: server-orchestrator

      - name: Build swarmctl
        shell: bash
        run: |
          set -euo pipefail
          cd server-orchestrator
          go build -o ../swarmctl ./cmd/swarmctl
          chmod +x ../swarmctl
          ../swarmctl version

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:7}"
          image_tag="sha-${short_sha}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Using image_tag=${image_tag} from source SHA ${SOURCE_SHA}"

      - name: Preflight tag policy check
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          env_lc="$(echo "${TARGET_ENV}" | tr '[:upper:]' '[:lower:]')"
          tag_lc="$(echo "${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]')"

          if [[ "${env_lc}" != "staging" ]]; then
            if [[ "${tag_lc}" =~ ^sha-[0-9a-f]{7,64}$ ]]; then
              :
            elif [[ "${tag_lc}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][a-z0-9.]+)?$ ]]; then
              :
            else
              echo "Blocked before dispatch: non-staging image_tag '${IMAGE_TAG}' is not allowed (env=${TARGET_ENV})." >&2
              echo "Allowed patterns: sha-<hex>, v<major>.<minor>.<patch>, <major>.<minor>.<patch> (optional -rc.1 style suffix)." >&2
              exit 1
            fi
          fi

          echo "Auto-dispatch preflight passed for env=${TARGET_ENV}, image_tag=${IMAGE_TAG}."

      - name: Validate infra observability
        run: |
          ./swarmctl infra ips --env ${{ env.TARGET_ENV }}
          ./swarmctl infra topology --env ${{ env.TARGET_ENV }}

      - name: Dispatch Swarmctl Validate & Deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          payload=$(jq -nc \
            --arg ref "${SOURCE_BRANCH}" \
            --arg environment "${TARGET_ENV}" \
            --arg image_tag "${IMAGE_TAG}" \
            --arg deploy_infra "${TARGET_DEPLOY_INFRA}" \
            --arg deploy_apps "${TARGET_DEPLOY_APPS}" \
            --arg dry_run "${TARGET_DRY_RUN}" \
            '{
              ref: $ref,
              inputs: {
                environment: $environment,
                image_tag: $image_tag,
                deploy_infra: $deploy_infra,
                deploy_apps: $deploy_apps,
                dry_run: $dry_run
              }
            }')

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/actions/workflows/swarmctl-deploy.yml/dispatches" \
            -d "${payload}"

          echo "Triggered swarmctl-deploy.yml for ${SOURCE_BRANCH} with image_tag=${IMAGE_TAG}, env=${TARGET_ENV}, dry_run=${TARGET_DRY_RUN}, swarmctl_ref=${SWARMCTL_REF}"
