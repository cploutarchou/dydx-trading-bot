apiVersion: swarmctl.io/v1
kind: App
metadata:
  name: dydx-trading-bot-frontend
  namespace: default
  team: frontend
  description: dYdX Trading Bot frontend for staging.
  labels:
    app: dydx-trading-bot-frontend
    service: frontend
    environment: staging
spec:
  image:
    repository: ghcr.io/cploutarchou/dydx-trading-bot/frontend
    tag: sha-2d96974
  replicas: 1
  ports:
  - name: http
    target: 80
    published: null
    protocol: tcp
    mode: ingress
    public: true
  ingress:
    enabled: true
    className: traefik
    hosts:
    - host: executionlab.io
      servicePort: http
      tls: true
    middlewares: []
    annotations: {}
  env:
    plain:
      VITE_API_URL: https://api.executionlab.io
      VITE_FORCE_MOCK_DATA: 'false'
  secrets:
  - name: dydx-trading-bot-frontend-basic-auth
    target: FRONTEND_BASIC_AUTH
    required: false
    external: true
  networks:
  - public
  - internal
  healthcheck:
    enabled: true
    type: http
    path: /
    port: http
    interval: 30s
    timeout: 5s
    retries: 3
    startPeriod: 20s
  resources:
    limits:
      cpus: '0.30'
      memory: 128M
    reservations:
      cpus: '0.10'
      memory: 64M
  deploy:
    strategy: rolling
    update:
      parallelism: 1
      delay: 10s
      order: start-first
      failureAction: rollback
    rollback:
      parallelism: 1
      delay: 10s
      order: stop-first
  restartPolicy:
    condition: on-failure
    delay: 5s
    maxAttempts: 3
    window: 120s
