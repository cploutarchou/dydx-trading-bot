apiVersion: swarmctl.io/v1
kind: App
metadata:
  name: dydx-trading-bot-api
  namespace: default
  team: backend
  description: Python Bot API for dYdX Trading Bot (production).
  labels:
    app: dydx-trading-bot-api
    service: api
    environment: production
spec:
  image:
    repository: ghcr.io/cploutarchou/dydx-trading-bot/api
    tag: sha-<commit> # Updated to use immutable tag for production
  replicas: 1

  ports:
    - name: http
      target: 8889
      published: null
      protocol: tcp
      mode: ingress
      public: false

  env:
    plain:
      BOT_API_HOST: "0.0.0.0"
      BOT_API_PORT: "8889"
      BOT_API_RELOAD: "false"
      BOT_API_WORKERS: "1"
      MARKETS_CACHE_TTL_SECONDS: "300"
      MARKETS_STALE_TTL_SECONDS: "3600"
      MARKETS_ENDPOINT_TIMEOUT_SECONDS: "6"
      LOG_LEVEL: "INFO"

      BOT_DB_TYPE: "postgresql"
      BOT_DB_CUTOVER_MODE: "shared"
      BOT_DB_HOST: "pgpool"
      BOT_DB_PORT: "5432"
      BOT_DB_NAME: "dydx_bot"
      BOT_DB_USER: "dydx_bot"
      BOT_DB_PASSWORD: ""

      DB_TYPE: "postgresql"
      DB_HOST: "pgpool"
      DB_PORT: "5432"
      DB_NAME: "dydx_bot"
      DB_USER: "dydx_bot"
      DB_PASSWORD: ""

      POSTGRES_HOST: "pgpool"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "dydx_bot"
      POSTGRES_USER: "dydx_bot"
      POSTGRES_PASSWORD: ""

      REDIS_ENABLED: "true"
      REDIS_HOST: "dydx-redis-ha_redis-master-proxy"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_SSL: "false"
      REDIS_TIMEOUT: "5"
      REDIS_PASSWORD: ""

      BACKTEST_WORKER_BACKEND: "celery"

      LOKI_ENABLED: "true"
      LOKI_URL: "http://81.17.102.165:3100"
      LOKI_LABELS: '{"app":"dydx-api","env":"production"}'

      IS_TESTNET: "true"
      APP_ENV: "production"
      ENVIRONMENT: "production"

      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "1"

      BOT_API_USE_SERVICE_TOKEN: "true"
      API_BYPASS_AUTH: "false"
      BACKTEST_DISABLE_REQUEST_SNAPSHOT_FALLBACK_IN_PRODUCTION: "true"
      STRATEGY_RESOLUTION_ALERT_WINDOW_SIZE: "200"
      STRATEGY_RESOLUTION_REQUEST_RATIO_ALERT_THRESHOLD: "0.05"
      STRATEGY_RESOLUTION_REQUEST_RATIO_ALERT_MIN_RUNS: "20"
      FRONTEND_URL: "https://executionlab.io"

  secrets:
    - name: dydx-jwt-secret-key
      target: JWT_SECRET_KEY
      required: true
      external: true
    - name: dydx-secret-key
      target: SECRET_KEY
      required: true
      external: true
    - name: dydx-encryption-key
      target: ENCRYPTION_KEY
      required: true
      external: true
    - name: dydx-bot-api-token
      target: BOT_API_TOKEN
      required: true
      external: true

  networks:
    - internal

  healthcheck:
    enabled: true
    type: http
    path: /health
    port: http
    interval: 30s
    timeout: 5s
    retries: 5
    startPeriod: 30s

  resources:
    limits:
      cpus: "0.50"
      memory: 512M
    reservations:
      cpus: "0.25"
      memory: 256M

  deploy:
    strategy: rolling
    update:
      parallelism: 1
      delay: 10s
      order: start-first
      failureAction: rollback
    rollback:
      parallelism: 1
      delay: 10s
      order: stop-first

  restartPolicy:
    condition: on-failure
    delay: 5s
    maxAttempts: 5
    window: 120s
