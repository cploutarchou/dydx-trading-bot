apiVersion: swarmctl.io/v1
kind: App
metadata:
  name: dydx-trading-bot-worker
  namespace: default
  team: backend
  description: Python Celery worker for dYdX Trading Bot (production).
  labels:
    app: dydx-trading-bot-worker
    service: worker
    environment: production
spec:
  image:
    repository: ghcr.io/cploutarchou/dydx-trading-bot/worker
    tag: sha-<commit> # Updated to use immutable tag for production
  replicas: 2

  env:
    plain:
      LOG_LEVEL: "INFO"

      BOT_DB_TYPE: "postgresql"
      BOT_DB_CUTOVER_MODE: "shared"
      BOT_DB_HOST: "pgpool"
      BOT_DB_PORT: "5432"
      BOT_DB_NAME: "dydx_bot"
      BOT_DB_USER: "dydx_bot"
      BOT_DB_PASSWORD: ""

      DB_TYPE: "postgresql"
      DB_HOST: "pgpool"
      DB_PORT: "5432"
      DB_NAME: "dydx_bot"
      DB_USER: "dydx_bot"
      DB_PASSWORD: ""

      POSTGRES_HOST: "pgpool"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "dydx_bot"
      POSTGRES_USER: "dydx_bot"
      POSTGRES_PASSWORD: ""

      REDIS_ENABLED: "true"
      REDIS_HOST: "dydx-redis-ha_redis-master-proxy"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_SSL: "false"
      REDIS_TIMEOUT: "5"
      REDIS_PASSWORD: ""

      BACKTEST_WORKER_BACKEND: "celery"
      WORKER_MODE: "celery-backtest"
      CELERY_CONCURRENCY: "10"
      CELERY_QUEUES: "celery"

      LOKI_ENABLED: "true"
      LOKI_URL: "http://81.17.102.165:3100"
      LOKI_LABELS: '{"app":"dydx-worker","env":"production"}'

      IS_TESTNET: "true"
      DYDX_TESTNET_NODE_URL: "test-dydx-grpc.kingnodes.com"
      APP_ENV: "production"
      ENVIRONMENT: "production"

  secrets:
    - name: dydx-jwt-secret-key
      target: JWT_SECRET_KEY
      required: true
      external: true
    - name: dydx-secret-key
      target: SECRET_KEY
      required: true
      external: true
    - name: dydx-encryption-key
      target: ENCRYPTION_KEY
      required: true
      external: true
    - name: dydx-bot-api-token
      target: BOT_API_TOKEN
      required: true
      external: true

  networks:
    - internal

  resources:
    limits:
      cpus: "1.00"
      memory: 2048M
    reservations:
      cpus: "0.50"
      memory: 1024M

  deploy:
    strategy: rolling
    update:
      parallelism: 1
      delay: 10s
      order: start-first
      failureAction: rollback
    rollback:
      parallelism: 1
      delay: 10s
      order: stop-first

  restartPolicy:
    condition: on-failure
    delay: 5s
    maxAttempts: 5
    window: 120s
