name: Governance And Contract Lock

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  governance-and-contract-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run task governance checks
        run: |
          make tasks-governance

      - name: Run contract lock tests
        run: |
          go test -count=1 ./internal/routes -run "TestContractLock_"

  frontend-contract-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend contract guard tests
        run: npm run test:contracts
        working-directory: frontend
        continue-on-error: false
