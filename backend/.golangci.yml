version: "2"

# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  build-tags:
    - integration
  modules-download-mode: readonly
  go: "1.25"

output:
  formats:
    text:
      path: stdout
  show-stats: true

linters:
  default: none

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (io.Closer).Close

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: true

    misspell:
      locale: US

    lll:
      line-length: 140
      tab-width: 4

    unused:
      field-writes-are-uses: true

    unparam:
      check-exported: false

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - unnamedResult
        - hugeParam
        - commentedOutCode

    godox:
      keywords:
        - TODO
        - FIXME
        - BUG
        - HACK
        - OPTIMIZE
        - XXX

    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: error-return
          disabled: false
        - name: error-strings
          disabled: false
        - name: increment-decrement
          disabled: false
        - name: var-declaration
          disabled: false
        - name: range
          disabled: false
        - name: receiver-naming
          disabled: false
        - name: time-naming
          disabled: false
        - name: indent-error-flow
          disabled: false
        - name: errorf
          disabled: false
        - name: empty-block
          disabled: false
        - name: superfluous-else
          disabled: false
        - name: unused-parameter
          disabled: false
        - name: unreachable-code
          disabled: false
        - name: redefines-builtin-id
          disabled: false
        - name: context-keys-type
          disabled: false
        - name: defer
          disabled: false

    staticcheck:
      checks: [ "all" ]

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104 # Audit errors not checked - covered by errcheck
        - G304 # File path provided as taint input

    cyclop:
      max-complexity: 15

    funlen:
      lines: 100
      statements: 50
      ignore-comments: true

    nestif:
      min-complexity: 4

    nilnil:
      checked-types:
        - ptr
        - func
        - iface
        - map
        - chan

    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Code quality
    - goconst
    - gocyclo
    - cyclop
    - funlen
    - misspell
    - revive
    - unconvert
    - unparam
    - nakedret
    - prealloc
    - nolintlint
    - gocritic
    - godox
    - nestif

    # Bug detection
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - errname
    - errorlint
    - wastedassign
    - nilnil
    - exhaustive

    # Security
    - gosec

    # Style
    - whitespace

    # Testing
    - tparallel
    - thelper

    # Dependencies
    - gomodguard

  exclusions:
    paths:
      - vendor
      - .idea
      - migrations
      - ".*\\.pb\\.go$"
      - ".*_generated\\.go$"

    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - gocyclo
          - cyclop
          - funlen
          - errcheck
          - dupl
          - gosec
          - goconst

      # Exclude known linters from partially hard-vendored code
      - path: internal/hmac/
        linters:
          - gosec

      # Exclude shadow checking on err variable
      - text: "shadow: declaration of \"err\""
        linters:
          - govet

      # Exclude some staticcheck messages
      - linters:
          - staticcheck
        text: "SA9003:"

      # Exclude linters that are noisy in main/setup functions
      - path: cmd/
        linters:
          - gocyclo
          - cyclop
          - funlen

      # Exclude godox from being an error in development
      - linters:
          - godox
        text: "TODO"

      # Allow blank imports in main packages
      - path: cmd/
        text: "blank import"
        linters:
          - revive

issues:
  uniq-by-line: true
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
