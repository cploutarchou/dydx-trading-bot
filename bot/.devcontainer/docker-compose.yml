services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: dydx-bot-dev:latest
    volumes:
      - ..:/workspace
      - venv:/workspace/venv
      - ~/.ssh:/home/vscode/.ssh:ro
      - ~/.gitconfig:/home/vscode/.gitconfig:ro
    ports:
      - "127.0.0.1:${DEV_BOT_API_PORT:-8889}:8889" # Bot API Server
      - "127.0.0.1:${DEV_FASTAPI_PORT:-8000}:8000" # FastAPI app
      - "127.0.0.1:${DEV_JUPYTER_PORT:-8888}:8888" # Jupyter
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dydx_bot
      - REDIS_URL=redis://redis:6379
      - ENV=development
    depends_on:
      - postgres
      - redis
    networks:
      - dydx-network
    command: /bin/bash -c "while sleep 1000; do :; done"
    user: vscode

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dydx_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-c max_connections=100 -c shared_buffers=256MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-network
    command: redis-server --appendonly yes

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    platform: linux/amd64
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dydx.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:${DEV_PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - dydx-network

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "127.0.0.1:${DEV_REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - dydx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  venv:
    driver: local

networks:
  dydx-network:
    driver: bridge
