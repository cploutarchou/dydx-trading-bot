name: Bot CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - "bot/**"
      - ".github/workflows/bot*.yml"
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - "bot/**"
      - ".github/workflows/bot*.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check active database patterns
        run: python3 scripts/check_no_legacy_database.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort
          pip install -r bot/requirements.txt

      - name: Lint with flake8
        working-directory: ./bot
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code style with Black
        working-directory: ./bot
        run: |
          # Enforced: build fails on formatting drift. Configuration lives in
          # pyproject.toml ([tool.black]) so CI and local format identically.
          black --check src tests --diff

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: bot_db
          MARIADB_USER: bot
          MARIADB_PASSWORD: bot
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -ubot -pbot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Check active database patterns
        run: python3 scripts/check_no_legacy_database.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Run tests with pytest
        env:
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3307"
          DB_NAME: bot_db
          DB_USER: bot
          DB_PASSWORD: bot
          BOT_DB_CUTOVER_MODE: shared
        run: |
          cd bot && python -m pytest tests/ -v --tb=short

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ lint ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: bot
          file: bot/Dockerfile
          push: false
          tags: dydx-bot:${{ github.sha }}
