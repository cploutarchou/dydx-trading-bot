name: Bot CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - "bot/**"
      - ".github/workflows/bot*.yml"
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - "bot/**"
      - ".github/workflows/bot*.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort
          pip install -r bot/requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 bot/src --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 bot/src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code style with Black
        run: |
          black --check bot/src --diff || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Run tests with pytest
        run: |
          cd bot && python -m pytest tests/ -v --tb=short 2>&1 | head -200 || true
        continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ lint ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: bot
          file: bot/Dockerfile
          push: false
          tags: dydx-bot:${{ github.sha }}
