name: Bot CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - "bot/**"
      - ".github/workflows/bot*.yml"
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - "bot/**"
      - ".github/workflows/bot*.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check active database patterns
        run: python3 scripts/check_no_legacy_database.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort
          pip install -r bot/requirements.txt

      - name: Lint with flake8
        working-directory: ./bot
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code style with Black
        working-directory: ./bot
        run: |
          # Enforced: build fails on formatting drift. Configuration lives in
          # pyproject.toml ([tool.black]) so CI and local format identically.
          black --check src tests --diff

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: bot_db
          MARIADB_USER: bot
          MARIADB_PASSWORD: bot
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -ubot -pbot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Check active database patterns
        run: python3 scripts/check_no_legacy_database.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Run tests with pytest
        env:
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3307"
          DB_NAME: bot_db
          DB_USER: bot
          DB_PASSWORD: bot
          BOT_DB_CUTOVER_MODE: shared
        # Coverage is reporting-only (does not fail the build). pytest-cov and
        # coverage are pulled in via requirements.txt. Configuration lives in
        # pyproject.toml ([tool.coverage.*]); source root is src.
        run: |
          cd bot && python -m pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Publish coverage summary
        if: always()
        working-directory: ./bot
        run: |
          python - <<'EOF'
          import os
          import xml.etree.ElementTree as ET

          path = "coverage.xml"
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not os.path.exists(path):
              msg = "### 📊 Test Coverage\n\ncoverage.xml not found — did the test step run?"
          else:
              root = ET.parse(path).getroot()
              line_rate = float(root.attrib.get("line-rate", 0)) * 100
              branch_rate = float(root.attrib.get("branch-rate", 0)) * 100
              lines_valid = int(root.attrib.get("lines-valid", 0))
              lines_covered = int(root.attrib.get("lines-covered", 0))
              msg = (
                  "### 📊 Test Coverage\n\n"
                  "| Metric | Value |\n| --- | --- |\n"
                  f"| Line coverage | **{line_rate:.1f}%** ({lines_covered}/{lines_valid}) |\n"
                  f"| Branch coverage | {branch_rate:.1f}% |\n\n"
                  "Download the **coverage-report** artifact and open `htmlcov/index.html` "
                  "for the full line-by-line report."
              )
          print(msg)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(msg + "\n")
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            bot/coverage.xml
            bot/htmlcov
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ lint ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: bot
          file: bot/Dockerfile
          push: false
          tags: dydx-bot:${{ github.sha }}
