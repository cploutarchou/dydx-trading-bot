# =============================================================================
# Nginx Configuration for dYdX Trading Bot
# =============================================================================
# Production-ready reverse proxy with security headers and rate limiting
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # =============================================================================
    # BASIC CONFIGURATION
    # =============================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;

    # =============================================================================
    # RATE LIMITING
    # =============================================================================
    # Authentication endpoints - strict limiting
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    
    # API endpoints - moderate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    
    # General endpoints - relaxed limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # =============================================================================
    # UPSTREAM SERVERS
    # =============================================================================
    upstream bot_api {
        server bot-api:8000;
        keepalive 32;
    }

    # =============================================================================
    # SECURITY HEADERS MAP
    # =============================================================================
    map $sent_http_content_type $security_headers {
        ~*text/html "nosniff";
    }

    # =============================================================================
    # HTTP TO HTTPS REDIRECT
    # =============================================================================
    server {
        listen 80;
        server_name _;
        
        # Health check endpoint (allow HTTP)
        location /health {
            proxy_pass http://bot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # =============================================================================
    # HTTPS SERVER
    # =============================================================================
    server {
        listen 443 ssl http2;
        server_name _;

        # =============================================================================
        # SSL CONFIGURATION
        # =============================================================================
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # SSL session settings
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # =============================================================================
        # SECURITY HEADERS
        # =============================================================================
        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        # Prevent clickjacking
        add_header X-Frame-Options DENY always;
        
        # Prevent MIME sniffing
        add_header X-Content-Type-Options nosniff always;
        
        # XSS Protection
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        
        # Permissions Policy
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # =============================================================================
        # CONNECTION LIMITS
        # =============================================================================
        limit_conn conn_limit_per_ip 20;

        # =============================================================================
        # AUTHENTICATION ENDPOINTS - STRICT RATE LIMITING
        # =============================================================================
        location /auth/ {
            limit_req zone=auth burst=3 nodelay;
            
            proxy_pass http://bot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # Authentication specific headers
            proxy_set_header X-Auth-Request-Redirect $request_uri;
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Disable buffering for real-time responses
            proxy_buffering off;
        }

        # =============================================================================
        # API ENDPOINTS - MODERATE RATE LIMITING
        # =============================================================================
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://bot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeout settings for potentially long-running API calls
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # 5 minutes for long operations
            
            # Enable response buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # =============================================================================
        # WEBSOCKET ENDPOINTS
        # =============================================================================
        location /ws {
            limit_req zone=api burst=5 nodelay;
            
            proxy_pass http://bot_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeout settings
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;  # 1 hour for persistent connections
            
            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # =============================================================================
        # DOCUMENTATION AND STATIC CONTENT
        # =============================================================================
        location /docs {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://bot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache static documentation assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1d;
                add_header Cache-Control "public, immutable";
                proxy_pass http://bot_api;
            }
        }

        # =============================================================================
        # HEALTH CHECK - NO RATE LIMITING
        # =============================================================================
        location /health {
            access_log off;
            
            proxy_pass http://bot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Quick timeout for health checks
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        # =============================================================================
        # ROOT AND DEFAULT ROUTES
        # =============================================================================
        location / {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://bot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # Standard timeout settings
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Enable response buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # =============================================================================
        # ERROR PAGES
        # =============================================================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            internal;
            return 404 "Not Found";
        }
        
        location = /50x.html {
            internal;
            return 500 "Internal Server Error";
        }

        # =============================================================================
        # SECURITY: BLOCK COMMON ATTACK PATTERNS
        # =============================================================================
        # Block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block SQL injection attempts
        location ~* (union.*select|select.*union|select.*from|insert.*into|delete.*from) {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block suspicious user agents
        if ($http_user_agent ~* (nikto|sqlmap|nmap|w3af|curl|wget)) {
            return 444;
        }
    }
}