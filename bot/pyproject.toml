[project]
name = "bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=49.0.0",
    "django-qrcode>=0.3",
    "fastapi>=0.139.2",
    "httpx>=0.27.2,<0.28",
    "loguru>=0.7.3",
    "passlib>=1.7.4",
    "pyotp>=2.10.0",
    "python-decouple>=3.8",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.51",
    "uliweb-alembic>=0.6.9",
    "uvicorn>=0.51.0",
]

[tool.black]
# Pinned so formatting is identical regardless of the Python that runs Black.
# CI uses a 3.11 runner while the project targets >=3.12; without this, the
# auto-detected target version could diverge between CI and local machines.
line-length = 88
target-version = ["py312"]

[tool.coverage.run]
# Measure production code only. The test suite lives under tests/ and is never
# counted toward coverage; src/ is the single source root.
source = ["src"]
branch = true
# Generated/migration/cache paths carry no measurable business logic.
omit = [
    "*/__pycache__/*",
    "*/alembic/*",
    "*/migrations/*",
    "*/proto/*",
]

[tool.coverage.report]
# Surface uncovered lines directly in the terminal report so gaps are visible
# without opening the HTML report.
show_missing = true
skip_covered = false
precision = 1
# Lines that are not reasonably reachable and should not count as gaps.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",  # `...` placeholder bodies (Protocol / overload stubs)
]

[tool.coverage.paths]
# Normalize reported paths so coverage.xml / htmlcov are stable across the CI
# runner and local machines (used when combining data files).
source = [
    "src",
    "*/bot/src",
    "*/site-packages/src",
]

[tool.mypy]
# ---------------------------------------------------------------------------
# Type checking — phase 1 (reporting-only baseline; does NOT gate CI yet).
# ---------------------------------------------------------------------------
# The codebase predates type annotations, so mypy runs in CI as a NON-blocking
# job (see the `bot-typecheck` job in .github/workflows/bot-quality.yml, which
# uses continue-on-error) to surface existing type debt without blocking merges.
# Tighten over time:
#   1. Clear errors module-by-module — largest offenders: infrastructure/
#      persistence/repository.py, infrastructure/event_bus_nats.py,
#      infrastructure/persistence/repository_backtest.py.
#   2. Flip the CI job to blocking (drop continue-on-error, add to quality-gate).
#   3. Enable the stricter options commented out below.
python_version = "3.12"
# `src` is the importable top package, but several subpackages (api/v1,
# api/pair_history, infrastructure/persistence, infrastructure/use_cases) are
# namespace packages without __init__.py; mypy needs this to resolve modules.
explicit_package_bases = true
# Many runtime deps ship no stubs (dydx-v4-client, bip-utils, crcmod,
# clickhouse-connect, minio, aiolimiter, pybreaker, flower, ...). Silencing
# missing-import noise keeps the report focused on our own code.
ignore_missing_imports = true
# Skip generated/vendored/cache dirs if mypy follows an import into them.
exclude = '^(_build|build|dist|\.venv|__pycache__|bot_states)/'

# --- Phase-2 candidates (enable after the baseline above is cleared) ---
# Notes on deferral: warn_unused_ignores / warn_redundant_casts are valuable but
# make the ratchet non-monotonic (fixing a real error can turn a previously-needed
# `# type: ignore` into an unused-ignore warning, raising the count). Enable them
# once the core type debt is cleared. check_untyped_defs will add errors from
# unannotated function bodies; disallow_untyped_defs requires annotations.
# warn_unused_configs = true
# warn_redundant_casts = true
# warn_unused_ignores = true
# check_untyped_defs = true
# disallow_untyped_defs = true
# warn_return_any = true
# strict = true

[tool.bandit]
# ---------------------------------------------------------------------------
# Security scanning — phase 1 (reporting-only baseline; does NOT gate CI yet).
# ---------------------------------------------------------------------------
# bandit runs in CI as a NON-blocking job (see the `bot-security` job in
# .github/workflows/bot-quality.yml, which uses continue-on-error) at medium+
# high severity (`-ll`). Low-severity findings (mostly assert/B101 and
# try/except-pass patterns) are suppressed from the report for signal-to-noise.
# Baseline (2026-08): 3 medium, 0 high — 2x B104 (bind 0.0.0.0, standard for
# containerized services) + 1x B608 (f-string SQL with internal table constants,
# false positive). Tighten over time: triage findings, add `# nosec` with
# justification or fix, then flip the job to a gate (drop continue-on-error,
# add to quality-gate.needs).
exclude_dirs = [
    "tests",
    ".venv",
    "build",
    "dist",
    "htmlcov",
    "scripts",
    "bot_states",
]
