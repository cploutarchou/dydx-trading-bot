[project]
name = "bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=49.0.0",
    "django-qrcode>=0.3",
    "fastapi>=0.139.2",
    "httpx>=0.27.2,<0.28",
    "loguru>=0.7.3",
    "passlib>=1.7.4",
    "pyotp>=2.10.0",
    "python-decouple>=3.8",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.51",
    "uliweb-alembic>=0.6.9",
    "uvicorn>=0.51.0",
]

[tool.black]
# Pinned so formatting is identical regardless of the Python that runs Black.
# CI uses a 3.11 runner while the project targets >=3.12; without this, the
# auto-detected target version could diverge between CI and local machines.
line-length = 88
target-version = ["py312"]

[tool.isort]
# profile="black" keeps isort fully compatible with Black (no fighting over
# import placement); line-length matches [tool.black]. Enforced in the bot-lint
# CI job and the pre-commit hook (both pinned to isort==6.0.1).
profile = "black"
line_length = 88
known_first_party = ["src"]

[tool.coverage.run]
# Measure production code only. The test suite lives under tests/ and is never
# counted toward coverage; src/ is the single source root.
source = ["src"]
branch = true
# Generated/migration/cache paths carry no measurable business logic.
omit = [
    "*/__pycache__/*",
    "*/alembic/*",
    "*/migrations/*",
    "*/proto/*",
]

[tool.coverage.report]
# Surface uncovered lines directly in the terminal report so gaps are visible
# without opening the HTML report.
show_missing = true
skip_covered = false
precision = 1
# Lines that are not reasonably reachable and should not count as gaps.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",  # `...` placeholder bodies (Protocol / overload stubs)
]

[tool.coverage.paths]
# Normalize reported paths so coverage.xml / htmlcov are stable across the CI
# runner and local machines (used when combining data files).
source = [
    "src",
    "*/bot/src",
    "*/site-packages/src",
]

[tool.mypy]
# ---------------------------------------------------------------------------
# Type checking — BLOCKING gate (baseline cleared 2026-08-16: 234 errors → 0;
# phase-2 options enabled same day: check_untyped_defs + warn_unused_ignores +
# warn_redundant_casts, new count driven back to 0)
# ---------------------------------------------------------------------------
# The codebase predates type annotations; the historical debt was cleared
# module-by-module and `bot-typecheck` (see .github/workflows/bot-quality.yml)
# now gates merges — any new error fails the build. Keep new code typed; the
# options commented below are the next tightening steps.
python_version = "3.12"
# `src` is the importable top package, but several subpackages (api/v1,
# api/pair_history, infrastructure/persistence, infrastructure/use_cases) are
# namespace packages without __init__.py; mypy needs this to resolve modules.
explicit_package_bases = true
# Many runtime deps ship no stubs (dydx-v4-client, bip-utils, crcmod,
# clickhouse-connect, minio, aiolimiter, pybreaker, flower, ...). Silencing
# missing-import noise keeps the report focused on our own code.
ignore_missing_imports = true
# Skip generated/vendored/cache dirs if mypy follows an import into them.
exclude = '^(_build|build|dist|\.venv|__pycache__|bot_states)/'

# --- Phase-2 options ENABLED 2026-08-16 (drove the new count back to 0) ---
# Bodies of unannotated functions are checked, and stale ignores / redundant
# casts are flagged so `# type: ignore` debt can't silently accumulate.
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# --- Phase-3 options ENABLED 2026-08-22 (phase 3a) ---
# warn_return_any: Any can no longer leak out of typed signatures (36 sites
# fixed; several were real seam fixes — api_response, run_db, and
# _retry_with_backoff gained proper generics/annotations).
# disallow_untyped_defs: new code must be fully annotated. The modules below
# still have pre-annotation defs; they are ratchet-exempt — shrink this list
# as modules are migrated (never grow it; tests/test_mypy_untyped_defs_ratchet.py
# pins the count). strict remains the end-state bundle after the list is empty.
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

# --- disallow_untyped_defs exemption ratchet (17 modules, 2026-08-22 phase 3b) ---
# Each entry is a module that still has unannotated defs. To migrate one:
# annotate its defs, run `.venv/bin/python -m mypy src` until clean, then
# remove the entry here AND from the ratchet test's expected set.
# Phase 3b (2026-08-22) migrated: workers/backtest_tasks, trading/portfolio_risk,
# trading/analysis/cointegration, shared/dataframe_utils, api/v1/bot_records,
# api/v1/auth, api/v1/arbitrage (24 -> 17).
[[tool.mypy.overrides]]
module = [
    "src.api.server",
    "src.api.v1.backtests",
    "src.api.v1.bot_lifecycle",
    "src.api.v1.bot_realtime",
    "src.api.v1.celery_admin",
    "src.api.v1.monitoring",
    "src.api.v1.strategies",
    "src.api.websocket_server",
    "src.bot_instance_manager",
    "src.infrastructure.database",
    "src.infrastructure.persistence.repository",
    "src.infrastructure.persistence.repository_realtime",
    "src.main_instance",
    "src.trading.account_manager",
    "src.trading.bot_agent",
    "src.trading.market_data",
    "src.trading.position_manager",
]
disallow_untyped_defs = false

[tool.bandit]
# ---------------------------------------------------------------------------
# Security scanning — phase 1 (reporting-only baseline; does NOT gate CI yet).
# ---------------------------------------------------------------------------
# bandit runs in CI as a NON-blocking job (see the `bot-security` job in
# .github/workflows/bot-quality.yml, which uses continue-on-error) at medium+
# high severity (`-ll`). Low-severity findings (mostly assert/B101 and
# try/except-pass patterns) are suppressed from the report for signal-to-noise.
# Baseline (2026-08): 3 medium, 0 high — 2x B104 (bind 0.0.0.0, standard for
# containerized services) + 1x B608 (f-string SQL with internal table constants,
# false positive). Tighten over time: triage findings, add `# nosec` with
# justification or fix, then flip the job to a gate (drop continue-on-error,
# add to quality-gate.needs).
exclude_dirs = [
    "tests",
    ".venv",
    "build",
    "dist",
    "htmlcov",
    "scripts",
    "bot_states",
]
