apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: ghcr.io/cploutarchou/dydx-trading-bot/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: ghcr.io/cploutarchou/dydx-trading-bot/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-database
                  key: url
            - name: BOT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: bot-api-token
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8888
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-api
        app.kubernetes.io/component: runtime
    spec:
      containers:
        - name: bot-api
          image: ghcr.io/cploutarchou/dydx-trading-bot/bot-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8889
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: BOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bot-database
                  key: url
            - name: BOT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bot-secrets
                  key: bot-api-token
            - name: BACKTEST_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backtest-minio
                  key: access-key
                  optional: true
            - name: BACKTEST_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backtest-minio
                  key: secret-key
                  optional: true
            - name: BACKTEST_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backtest-clickhouse
                  key: password
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bot-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bot-api
  ports:
    - name: http
      port: 8889
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bot-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-worker
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: bot-worker
          image: ghcr.io/cploutarchou/dydx-trading-bot/bot-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
          args:
            - src/main_instance.py
            - --instance-id
            - bot-1
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: BOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bot-database
                  key: url
            - name: BACKTEST_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backtest-minio
                  key: access-key
                  optional: true
            - name: BACKTEST_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backtest-minio
                  key: secret-key
                  optional: true
            - name: BACKTEST_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backtest-clickhouse
                  key: password
                  optional: true
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pgrep -f 'src/main_instance.py' >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pgrep -f 'src/main_instance.py' >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backtest-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backtest-worker
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: backtest-worker
          image: ghcr.io/cploutarchou/dydx-trading-bot/backtest-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              celery -A src.infrastructure.workers.celery_app:celery_app worker
              --loglevel=${CELERY_LOG_LEVEL:-INFO}
              --queues=${CELERY_QUEUES:-backtests,default,high_priority,scheduled}
              --concurrency=${CELERY_CONCURRENCY:-1}
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: BOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bot-database
                  key: url
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pgrep -f 'celery' >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pgrep -f 'celery' >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker-nats
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backtest-worker-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backtest-worker-nats
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: backtest-worker-nats
          image: ghcr.io/cploutarchou/dydx-trading-bot/backtest-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              exec python worker_entrypoint.py
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: WORKER_MODE
              value: "nats"
            - name: BACKTEST_WORKER_BACKEND
              value: "nats"
            # Connect to platform database for task tables access
            # The bot's database config falls back to DB_* vars if BOT_DB_* not set
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: platform-database
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: platform-database
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: platform-database
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-database
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-database
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pgrep -f 'python worker_entrypoint.py' >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pgrep -f 'python worker_entrypoint.py' >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
