apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  FRONTEND_PUBLIC_ORIGIN: https://app.dydx.example.com
  BACKEND_PUBLIC_ORIGIN: https://api.dydx.example.com
  BACKEND_BASE_URL: http://backend:8888
  BOT_API_BASE_URL: http://bot-api:8889
  # Production keeps feature flags off until staging validation is complete.
  # Flip to "true" after a successful staging soak and runbook sign-off.
  BACKTEST_MINIO_ENABLED: "false"
  BACKTEST_CLICKHOUSE_ENABLED: "false"
