apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  FRONTEND_PUBLIC_ORIGIN: https://app.dydx.example.com
  BACKEND_PUBLIC_ORIGIN: https://api.dydx.example.com
  BACKEND_BASE_URL: http://backend:8888
  BOT_API_BASE_URL: http://bot-api:8889
  # Production now inherits the default MinIO artifact path. Operators can still
  # force a rollback by setting either flag back to "false".
  BACKTEST_ARTIFACT_STORAGE_ENABLED: "true"
  BACKTEST_MINIO_ARTIFACTS_ENABLED: "true"
  BACKTEST_CLICKHOUSE_WRITES_ENABLED: "false"
