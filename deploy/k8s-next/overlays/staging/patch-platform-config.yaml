apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  FRONTEND_PUBLIC_ORIGIN: https://staging-app.example.com
  BACKEND_PUBLIC_ORIGIN: https://staging-api.example.com
  BACKEND_BASE_URL: http://backend:8888
  BOT_API_BASE_URL: http://bot-api:8889
  # Checked-in defaults stay off until the alternative storage paths are
  # explicitly validated for the target environment.
  BACKTEST_ARTIFACT_STORAGE_ENABLED: "false"
  BACKTEST_MINIO_ARTIFACTS_ENABLED: "false"
  BACKTEST_CLICKHOUSE_WRITES_ENABLED: "false"
