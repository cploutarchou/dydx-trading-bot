apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  FRONTEND_PUBLIC_ORIGIN: https://staging-app.example.com
  BACKEND_PUBLIC_ORIGIN: https://staging-api.example.com
  BACKEND_BASE_URL: http://backend:8888
  BOT_API_BASE_URL: http://bot-api:8889
  # Staging inherits the MinIO-backed artifact default so rollout validation
  # exercises the real object-storage path with the local fallback still intact.
  BACKTEST_ARTIFACT_STORAGE_ENABLED: "true"
  BACKTEST_MINIO_ARTIFACTS_ENABLED: "true"
  BACKTEST_CLICKHOUSE_WRITES_ENABLED: "false"
