apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  FRONTEND_PUBLIC_ORIGIN: https://staging-app.example.com
  BACKEND_PUBLIC_ORIGIN: https://staging-api.example.com
  BACKEND_BASE_URL: http://backend:8888
  BOT_API_BASE_URL: http://bot-api:8889
  # Staging enables MinIO and ClickHouse so the path is validated before
  # production promotion.  Credentials are injected via staging-secrets Secret.
  BACKTEST_MINIO_ENABLED: "true"
  BACKTEST_CLICKHOUSE_ENABLED: "true"
