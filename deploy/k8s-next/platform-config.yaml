apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  APP_ENV: production
  LOG_LEVEL: info
  FRONTEND_PUBLIC_ORIGIN: https://app.example.com
  BACKEND_PUBLIC_ORIGIN: https://api.example.com
  BACKEND_BASE_URL: http://backend:8888
  BOT_API_BASE_URL: http://bot-api:8889
  DB_TYPE: postgres
  BOT_DB_TYPE: postgres
  DB_HOST: pgbouncer
  DB_PORT: "6432"
  DB_NAME: dydx_platform
  BOT_DB_HOST: pgbouncer
  BOT_DB_PORT: "6432"
  BOT_DB_NAME: dydx_bot
  DATABASE_SERVICE_HOST: pgbouncer
  DATABASE_SERVICE_PORT: "6432"
  DATABASE_NAME: dydx_platform
  BOT_DATABASE_NAME: dydx_bot
  # ---------------------------------------------------------------------------
  # Task-table DB ownership (Phase 0 decision).
  #
  # The normalized command/run tables (task_commands, task_runs, task_attempts,
  # worker_heartbeats) are BACKEND-OWNED. They are created by backend migrations
  # 000063..000067 and live in the platform database (dydx_platform), which is
  # the authoritative store for command/run truth per the Final Target
  # Architecture. The bot-side NATS consumer MUST reach those tables to claim
  # runs and record attempts/heartbeats; it therefore needs access to the
  # platform database, NOT the bot-only dydx_bot database.
  #
  # TASK_DB_* below makes that ownership explicit. Today the bot consumer is not
  # wired to a second (platform) connection and NATS_ENABLED is "false", so this
  # split has no runtime effect. Wiring the consumer's platform-DB access and
  # flipping NATS_ENABLED is a Phase 2 prerequisite (see
  # docs/FINAL_APPLICATION_IMPROVEMENT_PLAN.md). Do not point the consumer at
  # dydx_bot for task tables — that would split command truth across databases.
  # ---------------------------------------------------------------------------
  TASK_DB_HOST: pgbouncer
  TASK_DB_PORT: "6432"
  TASK_DB_NAME: dydx_platform
  POSTGRES_HOST: postgresql
  POSTGRES_PORT: "5432"
  POSTGRES_DB: dydx_platform
  POSTGRES_SERVICE_HOST: postgresql
  POSTGRES_SERVICE_PORT: "5432"
  PGBOUNCER_SERVICE_HOST: pgbouncer
  PGBOUNCER_SERVICE_PORT: "6432"
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_URL: redis://valkey:6379/0
  VALKEY_HOST: valkey
  VALKEY_PORT: "6379"
  VALKEY_URL: redis://valkey:6379/0
  NATS_URL: nats://nats:4222
  NATS_MONITORING_URL: http://nats:8222
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: default
  CLICKHOUSE_USER: default
  CLICKHOUSE_URL: http://clickhouse:8123
  MINIO_ENDPOINT: minio:9000
  MINIO_CONSOLE_URL: http://minio:9001
  MINIO_BUCKET: backtests
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
  BACKTEST_ARTIFACTS_DIR: /var/lib/dydx/backtest-artifacts
  BACKTEST_HEARTBEAT_KEEPALIVE_SECONDS: "30"
  BACKTEST_ARTIFACT_STORAGE_ENABLED: "true"
  # MinIO artifact store is enabled by default; local fallback remains available
  # if the client or object store is unavailable during rollout validation.
  BACKTEST_MINIO_ARTIFACTS_ENABLED: "true"
  BACKTEST_MINIO_ENDPOINT: http://minio:9000
  BACKTEST_MINIO_BUCKET: backtests
  BACKTEST_MINIO_SECURE: "false"
  BACKTEST_MINIO_AUTO_CREATE_BUCKET: "true"
  # Credentials must come from a Secret; reference them in the Deployment env
  # via secretKeyRef (BACKTEST_MINIO_ACCESS_KEY / BACKTEST_MINIO_SECRET_KEY).
  # ClickHouse analytics writer — flip to "true" after validation
  BACKTEST_CLICKHOUSE_WRITES_ENABLED: "false"
  BACKTEST_CLICKHOUSE_BATCH_SIZE: "1000"
  BACKTEST_CLICKHOUSE_FLUSH_INTERVAL_SECONDS: "5"
  BACKTEST_CLICKHOUSE_URL: http://clickhouse:8123
  BACKTEST_CLICKHOUSE_HOST: clickhouse
  BACKTEST_CLICKHOUSE_PORT: "8123"
  BACKTEST_CLICKHOUSE_DATABASE: default
  BACKTEST_CLICKHOUSE_USER: default
  BACKTEST_CLICKHOUSE_SECURE: "false"
  # BACKTEST_CLICKHOUSE_PASSWORD must come from a Secret (secretKeyRef).
  NATS_ENABLED: "false"
  BOT_COMMAND_BUS_ENABLED: "false"
  FRONTEND_PORT: "8080"
  BACKEND_PORT: "8888"
  BOT_API_PORT: "8889"
