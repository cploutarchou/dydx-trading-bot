# Legacy manifest retained for historical reference only.
# Current active Kubernetes layout is deploy/k8s-next/ and the local infrastructure
# contract is PostgreSQL + Valkey + NATS JetStream + ClickHouse + MinIO.
---
apiVersion: v1
kind: Namespace
metadata:
  name: dydx-production

---
apiVersion: v1
kind: Secret
metadata:
  name: dydx-secrets
  namespace: dydx-production
type: Opaque
stringData:
  # Replace all placeholders before apply
  MARIADB_ROOT_PASSWORD: "REPLACE_ME"
  BREAK_GLASS_NEW_ROOT_PASSWORD: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  DB_ADMIN_USER: "dbadmin"
  DB_ADMIN_PASSWORD: "REPLACE_ME"
  SECRET_KEY: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"
  ENCRYPTION_KEY: "REPLACE_ME"
  BOT_API_TOKEN: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: dydx-mariadb-tls
  namespace: dydx-production
type: Opaque
stringData:
  # Replace with production DB TLS materials
  ca.crt: "REPLACE_WITH_CLUSTER_CA_CERT"
  tls.crt: "REPLACE_WITH_CLUSTER_TLS_CERT"
  tls.key: "REPLACE_WITH_CLUSTER_TLS_KEY"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dydx-mariadb-config
  namespace: dydx-production
data:
  99-tls.cnf: |
    [mariadb]
    require_secure_transport=ON
    ssl_ca=/etc/mysql/ssl/ca.crt
    ssl_cert=/etc/mysql/ssl/tls.crt
    ssl_key=/etc/mysql/ssl/tls.key
  10-bootstrap-admin-user.sh: |
    #!/bin/sh
    set -eu

    # Runs only on first DB initialization.
    mysql -uroot -p"${MARIADB_ROOT_PASSWORD}" <<SQL
    CREATE USER IF NOT EXISTS '${DB_ADMIN_USER}'@'%' IDENTIFIED BY '${DB_ADMIN_PASSWORD}';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP, REFERENCES,
      LOCK TABLES, CREATE TEMPORARY TABLES, EXECUTE ON app.* TO '${DB_ADMIN_USER}'@'%';
    FLUSH PRIVILEGES;
    SQL

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dydx-config
  namespace: dydx-production
data:
  ENVIRONMENT: "production"
  APP_CONFIG_ENV: "production"
  LOG_LEVEL: "INFO"

  # Backend API
  API_PORT: "8888"

  # Shared MariaDB
  DB_TYPE: "mysql"
  DB_HOST: "dydx-mariadb"
  DB_PORT: "3306"
  DB_NAME: "app"
  DB_USER: "app"
  SSL_MODE: "true"
  DB_AUTO_MIGRATE: "true"
  DB_SSL_MODE: "required"

  # Bot DB uses same MariaDB for production
  BOT_DB_TYPE: "mysql"
  BOT_DB_CUTOVER_MODE: "shared"
  BOT_DB_HOST: "dydx-mariadb"
  BOT_DB_PORT: "3306"
  BOT_DB_NAME: "app"
  BOT_DB_USER: "app"
  BOT_DB_SSL_MODE: "required"

  # Redis
  REDIS_HOST: "dydx-redis"
  REDIS_PORT: "6379"

  # Bot API
  BOT_API_HOST: "0.0.0.0"
  BOT_API_PORT: "8889"
  BOT_API_URL: "http://dydx-bot:8889"
  BOT_API_USE_SERVICE_TOKEN: "true"
  BACKTEST_HEARTBEAT_KEEPALIVE_SECONDS: "30"

  # Public app domain
  FRONTEND_URL: "https://executionlab.io"
  CORS_ALLOWED_ORIGINS: "https://executionlab.io,https://www.executionlab.io,https://app.executionlab.io,https://admin.executionlab.io"
  VITE_API_BASE_URL: "https://api.executionlab.io"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dydx-frontend-runtime-config
  namespace: dydx-production
data:
  executionlab-config.js: |
    window.__EXECUTIONLAB_CONFIG__ = {
      apiBaseUrl: "https://api.executionlab.io"
    };

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dydx-mariadb-pvc
  namespace: dydx-production
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-mariadb
  namespace: dydx-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-mariadb
  template:
    metadata:
      labels:
        app: dydx-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: "app"
            - name: MARIADB_USER
              value: "app"
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: DB_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_ADMIN_USER
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_ADMIN_PASSWORD
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: mariadb-tls
              mountPath: /etc/mysql/ssl
              readOnly: true
            - name: mariadb-tls-config
              mountPath: /etc/mysql/conf.d/99-tls.cnf
              subPath: 99-tls.cnf
            - name: mariadb-bootstrap
              mountPath: /docker-entrypoint-initdb.d/10-bootstrap-admin-user.sh
              subPath: 10-bootstrap-admin-user.sh
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: dydx-mariadb-pvc
        - name: mariadb-tls
          secret:
            secretName: dydx-mariadb-tls
        - name: mariadb-tls-config
          configMap:
            name: dydx-mariadb-config
        - name: mariadb-bootstrap
          configMap:
            name: dydx-mariadb-config
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-mariadb
  namespace: dydx-production
spec:
  selector:
    app: dydx-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-mariadb-public
  namespace: dydx-production
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - 212.32.18.42/32
  selector:
    app: dydx-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dydx-mariadb-ingress-restrictions
  namespace: dydx-production
spec:
  podSelector:
    matchLabels:
      app: dydx-mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dydx-backend
        - podSelector:
            matchLabels:
              app: dydx-bot
        - ipBlock:
            cidr: 212.32.18.42/32
      ports:
        - protocol: TCP
          port: 3306

---
apiVersion: batch/v1
kind: Job
metadata:
  name: dydx-mariadb-admin-sync
  namespace: dydx-production
spec:
  suspend: true
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mariadb-admin-sync
          image: mariadb:11.4
          env:
            - name: DB_HOST
              value: "dydx-mariadb"
            - name: DB_PORT
              value: "3306"
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: DB_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_ADMIN_USER
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_ADMIN_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for MariaDB to become reachable over TLS..."
              until mariadb-admin \
                --host="$DB_HOST" \
                --port="$DB_PORT" \
                --user=root \
                --password="$MARIADB_ROOT_PASSWORD" \
                --ssl \
                --ssl-ca=/tls/ca.crt \
                ping --silent; do
                sleep 3
              done

              mariadb \
                --host="$DB_HOST" \
                --port="$DB_PORT" \
                --user=root \
                --password="$MARIADB_ROOT_PASSWORD" \
                --ssl \
                --ssl-ca=/tls/ca.crt <<SQL
              CREATE USER IF NOT EXISTS '${DB_ADMIN_USER}'@'%' IDENTIFIED BY '${DB_ADMIN_PASSWORD}';
              ALTER USER '${DB_ADMIN_USER}'@'%' IDENTIFIED BY '${DB_ADMIN_PASSWORD}';
              REVOKE ALL PRIVILEGES, GRANT OPTION FROM '${DB_ADMIN_USER}'@'%';
              GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP, REFERENCES,
                LOCK TABLES, CREATE TEMPORARY TABLES, EXECUTE ON app.* TO '${DB_ADMIN_USER}'@'%';
              FLUSH PRIVILEGES;
              SQL

              echo "DB admin user sync complete."
          volumeMounts:
            - name: mariadb-tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: mariadb-tls
          secret:
            secretName: dydx-mariadb-tls

---
apiVersion: batch/v1
kind: Job
metadata:
  name: dydx-mariadb-breakglass-root-rotation
  namespace: dydx-production
spec:
  suspend: true
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: breakglass-root-rotation
          image: mariadb:11.4
          env:
            - name: DB_HOST
              value: "dydx-mariadb"
            - name: DB_PORT
              value: "3306"
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: BREAK_GLASS_NEW_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: BREAK_GLASS_NEW_ROOT_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              echo "BREAK-GLASS root rotation job started."
              echo "This job should remain suspended unless explicitly approved."

              mariadb \
                --host="$DB_HOST" \
                --port="$DB_PORT" \
                --user=root \
                --password="$MARIADB_ROOT_PASSWORD" \
                --ssl \
                --ssl-ca=/tls/ca.crt <<SQL
              ALTER USER 'root'@'localhost' IDENTIFIED BY '${BREAK_GLASS_NEW_ROOT_PASSWORD}';
              FLUSH PRIVILEGES;
              SQL

              echo "Root password rotated. Update dydx-secrets/MARIADB_ROOT_PASSWORD immediately."
          volumeMounts:
            - name: mariadb-tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: mariadb-tls
          secret:
            secretName: dydx-mariadb-tls

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-redis
  namespace: dydx-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-redis
  template:
    metadata:
      labels:
        app: dydx-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-redis
  namespace: dydx-production
spec:
  selector:
    app: dydx-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-bot
  namespace: dydx-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-bot
  template:
    metadata:
      labels:
        app: dydx-bot
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bot
          image: ghcr.io/cploutarchou/dydx-trading-bot/api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "uvicorn"]
          args: ["src.api.server:app", "--host", "0.0.0.0", "--port", "8889"]
          ports:
            - containerPort: 8889
          envFrom:
            - configMapRef:
                name: dydx-config
          env:
            - name: WORKER_MODE
              value: celery
            - name: BACKTEST_WORKER_BACKEND
              value: celery
            - name: CELERY_QUEUES
              value: backtests,default,high_priority,scheduled
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: BOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: ENCRYPTION_KEY
            - name: BOT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: BOT_API_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: 8889
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8889
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-worker
  namespace: dydx-production
spec:
  replicas: 1
  selector:
    matchLabels:
