              value: "https://api.executionlab.io"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend-runtime-config
              mountPath: /usr/share/nginx/html/executionlab-config.js
              subPath: executionlab-config.js
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: frontend-runtime-config
          configMap:
            name: dydx-frontend-runtime-config

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-frontend
  namespace: dydx-production
spec:
  selector:
    app: dydx-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dydx-frontend
  namespace: dydx-production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: executionlab.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dydx-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - executionlab.io
      secretName: executionlab-io-tls
