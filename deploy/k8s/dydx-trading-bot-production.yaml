    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: worker
          image: ghcr.io/cploutarchou/dydx-trading-bot/worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: dydx-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: BOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: ENCRYPTION_KEY
            - name: BOT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: BOT_API_TOKEN

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-bot
  namespace: dydx-production
spec:
  selector:
    app: dydx-bot
  ports:
    - name: http
      port: 8889
      targetPort: 8889

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-backend
  namespace: dydx-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-backend
  template:
    metadata:
      labels:
        app: dydx-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/cploutarchou/dydx-trading-bot/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: dydx-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: BOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: ENCRYPTION_KEY
            - name: BOT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: BOT_API_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-backend
  namespace: dydx-production
  labels:
    app: dydx-backend
spec:
  selector:
    app: dydx-backend
  ports:
    - name: http
      port: 8888
      targetPort: 8888

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dydx-backend
  namespace: dydx-production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: api.executionlab.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dydx-backend
                port:
                  number: 8888
  tls:
    - hosts:
        - api.executionlab.io
      secretName: api-executionlab-io-tls

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-frontend
  namespace: dydx-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-frontend
  template:
