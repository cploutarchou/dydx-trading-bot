---
apiVersion: v1
kind: Namespace
metadata:
  name: dydx-staging

---
apiVersion: v1
kind: Secret
metadata:
  name: dydx-secrets
  namespace: dydx-staging
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: "REPLACE_ME_ROOT_PASSWORD"
  DB_PASSWORD: "REPLACE_ME_DB_PASSWORD"
  DB_ADMIN_USER: "dbadmin"
  DB_ADMIN_PASSWORD: "REPLACE_ME_DB_ADMIN_PASSWORD"
  SECRET_KEY: "REPLACE_ME_SECRET_KEY"
  JWT_SECRET_KEY: "REPLACE_ME_JWT_SECRET_KEY"
  ENCRYPTION_KEY: "REPLACE_ME_ENCRYPTION_KEY"
  BOT_API_TOKEN: "REPLACE_ME_BOT_API_TOKEN"

---
apiVersion: v1
kind: Secret
metadata:
  name: dydx-mariadb-tls
  namespace: dydx-staging
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CA_CERT_PEM
    -----END CERTIFICATE-----
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SERVER_CERT_PEM
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_SERVER_KEY_PEM
    -----END PRIVATE KEY-----

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dydx-mariadb-config
  namespace: dydx-staging
data:
  99-tls.cnf: |
    [mariadb]
    require_secure_transport=ON
    ssl_ca=/etc/mysql/ssl/ca.crt
    ssl_cert=/etc/mysql/ssl/tls.crt
    ssl_key=/etc/mysql/ssl/tls.key
  10-bootstrap-admin-user.sh: |
    #!/bin/sh
    set -eu

    # Runs only on first DB initialization.
    mysql -uroot -p"${MARIADB_ROOT_PASSWORD}" <<SQL
    CREATE USER IF NOT EXISTS '${DB_ADMIN_USER}'@'%' IDENTIFIED BY '${DB_ADMIN_PASSWORD}';
    GRANT ALL PRIVILEGES ON *.* TO '${DB_ADMIN_USER}'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
    SQL

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dydx-config
  namespace: dydx-staging
data:
  ENVIRONMENT: "staging"
  APP_CONFIG_ENV: "staging"
  LOG_LEVEL: "INFO"

  # Backend API
  API_PORT: "8888"

  # Shared MariaDB
  DB_TYPE: "mysql"
  DB_HOST: "dydx-mariadb"
  DB_PORT: "3306"
  DB_NAME: "app"
  DB_USER: "app"
  DB_SSL_MODE: "required"

  # Bot DB uses same MariaDB for lean staging
  BOT_DB_TYPE: "mysql"
  BOT_DB_CUTOVER_MODE: "dedicated"
  BOT_DB_HOST: "dydx-mariadb"
  BOT_DB_PORT: "3306"
  BOT_DB_NAME: "app"
  BOT_DB_USER: "app"
  BOT_DB_SSL_MODE: "required"

  # Redis
  REDIS_HOST: "dydx-redis"
  REDIS_PORT: "6379"

  # Bot API
  BOT_API_HOST: "0.0.0.0"
  BOT_API_PORT: "8889"
  BOT_API_URL: "http://dydx-bot:8889"
  BOT_API_USE_SERVICE_TOKEN: "true"

  # Public app domain
  FRONTEND_URL: "https://staging.executionlab.io"
  CORS_ALLOWED_ORIGINS: "https://staging.executionlab.io"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dydx-mariadb-pvc
  namespace: dydx-staging
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-mariadb
  namespace: dydx-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-mariadb
  template:
    metadata:
      labels:
        app: dydx-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: "app"
            - name: MARIADB_USER
              value: "app"
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: DB_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_ADMIN_USER
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_ADMIN_PASSWORD
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: mariadb-tls
              mountPath: /etc/mysql/ssl
              readOnly: true
            - name: mariadb-tls-config
              mountPath: /etc/mysql/conf.d/99-tls.cnf
              subPath: 99-tls.cnf
            - name: mariadb-bootstrap
              mountPath: /docker-entrypoint-initdb.d/10-bootstrap-admin-user.sh
              subPath: 10-bootstrap-admin-user.sh
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: dydx-mariadb-pvc
        - name: mariadb-tls
          secret:
            secretName: dydx-mariadb-tls
        - name: mariadb-tls-config
          configMap:
            name: dydx-mariadb-config
        - name: mariadb-bootstrap
          configMap:
            name: dydx-mariadb-config
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-mariadb
  namespace: dydx-staging
spec:
  selector:
    app: dydx-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-mariadb-public
  namespace: dydx-staging
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - 203.0.113.10/32
    - 198.51.100.22/32
  selector:
    app: dydx-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dydx-mariadb-ingress-restrictions
  namespace: dydx-staging
spec:
  podSelector:
    matchLabels:
      app: dydx-mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dydx-backend
        - podSelector:
            matchLabels:
              app: dydx-bot
        - ipBlock:
            cidr: 203.0.113.10/32
        - ipBlock:
            cidr: 198.51.100.22/32
      ports:
        - protocol: TCP
          port: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-redis
  namespace: dydx-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-redis
  template:
    metadata:
      labels:
        app: dydx-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-redis
  namespace: dydx-staging
spec:
  selector:
    app: dydx-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-bot
  namespace: dydx-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-bot
  template:
    metadata:
      labels:
        app: dydx-bot
    spec:
      containers:
        - name: bot
          image: ghcr.io/example/dydx-trading-bot-bot:latest
          ports:
            - containerPort: 8889
          envFrom:
            - configMapRef:
                name: dydx-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: BOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: ENCRYPTION_KEY
            - name: BOT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: BOT_API_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: 8889
            initialDelaySeconds: 10
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-bot
  namespace: dydx-staging
spec:
  selector:
    app: dydx-bot
  ports:
    - name: http
      port: 8889
      targetPort: 8889

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-backend
  namespace: dydx-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-backend
  template:
    metadata:
      labels:
        app: dydx-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/dydx-trading-bot-backend:latest
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: dydx-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: BOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: ENCRYPTION_KEY
            - name: BOT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: BOT_API_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-backend
  namespace: dydx-staging
spec:
  selector:
    app: dydx-backend
  ports:
    - name: http
      port: 8888
      targetPort: 8888

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dydx-frontend
  namespace: dydx-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dydx-frontend
  template:
    metadata:
      labels:
        app: dydx-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/dydx-trading-bot-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: dydx-frontend
  namespace: dydx-staging
spec:
  selector:
    app: dydx-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dydx-frontend
  namespace: dydx-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: staging.executionlab.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dydx-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - staging.executionlab.io
      secretName: staging-executionlab-io-tls
