                  key: DB_PASSWORD
            - name: BOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dydx-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
