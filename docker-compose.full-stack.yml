version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dydx_backtest_db
    environment:
      POSTGRES_DB: dydx_backtest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Server
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: dydx_backtest_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DB_TYPE: postgresql
      DB_NAME: dydx_backtest
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: postgres
      DB_PORT: "5432"
      JWT_SECRET_KEY: your-secret-key-change-in-production-use-strong-key-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (Vite dev server)
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    container_name: dydx_backtest_ui
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

  # Optional: Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: dydx_backtest_cache
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: dydx_backtest_network
