---
# Apple Silicon (M1/M2/M3) optimized infrastructure-only compose
# Run this with: make infra-up-arm64
# Use for Apple Silicon Macs - infrastructure services with linux/arm64 platform
#
# Services:
#   - PostgreSQL (5432): Main transactional database
#   - Valkey (6379): Redis-compatible cache/locks/state
#   - NATS JetStream (4222): Event/command bus
#   - ClickHouse (8123): Analytics database
#   - MinIO (9010/9011): Object storage for artifacts

services:
  # ============================================================================
  # DATA LAYER - ARM64 optimized
  # ============================================================================

  postgresql:
    image: postgres:15.18-bookworm
    container_name: dydx-postgresql-arm64
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dydx_bot}
      POSTGRES_USER: ${POSTGRES_USER:-dydx_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-infra-arm64

  postgresql-bot-db-init:
    image: postgres:15.18-bookworm
    restart: "no"
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-dydx_bot}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      BOT_POSTGRES_DB: ${BOT_POSTGRES_DB:-dydx_bot_runtime}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$${BOT_POSTGRES_DB}'" | grep -q 1; then
          createdb "$${BOT_POSTGRES_DB}"
        fi
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - dydx-infra-arm64

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: dydx-valkey-arm64
    platform: linux/arm64
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-infra-arm64

  nats:
    image: nats:2.10-alpine
    container_name: dydx-nats-arm64
    platform: linux/arm64
    restart: unless-stopped
    command:
      - -js
      - -m
      - "8222"
      - -sd
      - /data
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-infra-arm64

  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: dydx-clickhouse-arm64
    platform: linux/arm64
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-dydx_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-infra-arm64

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: dydx-minio-arm64
    platform: linux/arm64
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-change-me-minio-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio-secret-key}
    command:
      - server
      - /data
      - --console-address
      - :9011
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-infra-arm64

networks:
  dydx-infra-arm64:
    driver: bridge
    name: dydx-infra-arm64

volumes:
  postgresql_data:
    driver: local
  valkey_data:
    driver: local
  nats_data:
    driver: local
  clickhouse_data:
    driver: local
  minio_data:
    driver: local
