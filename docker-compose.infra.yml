name: dydx-trading-bot

services:
  postgres:
    image: postgres:15-alpine
    container_name: dydx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dydx_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-dydx_bot}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dydx_bot} -d ${POSTGRES_DB:-dydx_bot}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dydx-network
    mem_limit: 512m
    cpus: 0.50

  redis:
    image: redis:7-alpine
    container_name: dydx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dydx-network
    mem_limit: 256m
    cpus: 0.50

  haproxy:
    image: haproxy:2.9-alpine
    container_name: dydx-haproxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HAPROXY_BIND_IP:-0.0.0.0}:${POSTGRES_PROXY_PORT:-5040}:5040"
      - "${HAPROXY_BIND_IP:-0.0.0.0}:${REDIS_PROXY_PORT:-5045}:5045"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dydx-network
    mem_limit: 128m
    cpus: 0.25

networks:
  dydx-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
