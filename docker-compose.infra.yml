version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: dydx-dev-postgres
    environment:
      POSTGRES_USER: dydx_bot
      POSTGRES_PASSWORD: change-me-db-password
      POSTGRES_DB: dydx_bot
    ports:
      - "5432:5432"
    volumes:
      - dydx-dev-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dydx-dev-redis
    ports:
      - "6379:6379"

volumes:
  dydx-dev-postgres-data:
    name: dydx-dev-postgres-data
