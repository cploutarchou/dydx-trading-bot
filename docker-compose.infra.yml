name: dydx-trading-bot

services:
  postgres:
    image: postgres:15-alpine
    container_name: dydx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dydx_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-dydx_bot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dydx_bot} -d ${POSTGRES_DB:-dydx_bot}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dydx-network
    mem_limit: 512m
    cpus: 0.50

  redis:
    image: redis:7-alpine
    container_name: dydx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dydx-network
    mem_limit: 256m
    cpus: 0.50

networks:
  dydx-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
