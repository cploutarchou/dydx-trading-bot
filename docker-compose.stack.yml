name: dydx-trading-bot

services:
  postgres:
    image: postgres:15-alpine
    container_name: dydx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dydx_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-dydx_bot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dydx_bot} -d ${POSTGRES_DB:-dydx_bot}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dydx-network
    mem_limit: 512m
    cpus: 0.50

  redis:
    image: redis:7-alpine
    container_name: dydx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dydx-network
    mem_limit: 256m
    cpus: 0.50

  api:
    build:
      context: ./bot
      dockerfile: docker/Dockerfile
      target: development
    container_name: dydx-api
    restart: unless-stopped
    working_dir: /app
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dydx_bot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      DB_NAME: ${POSTGRES_DB:-dydx_bot}
      SECRET_KEY: ${SECRET_KEY:-change-me-jwt-secret-min-32-chars}
      JWT_SECRET_KEY: ${SECRET_KEY:-change-me-jwt-secret-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PASSWORD_RESET_TOKEN_EXPIRE_HOURS: ${PASSWORD_RESET_TOKEN_EXPIRE_HOURS:-1}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-15}
      REDIS_ENABLED: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      IS_TESTNET: ${IS_TESTNET:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DYDX_TESTNET_ADDRESS: ${DYDX_TESTNET_ADDRESS:-}
      DYDX_TESTNET_MNEMONIC: ${DYDX_TESTNET_MNEMONIC:-}
      DYDX_MAINNET_ADDRESS: ${DYDX_MAINNET_ADDRESS:-}
      DYDX_MAINNET_MNEMONIC: ${DYDX_MAINNET_MNEMONIC:-}
      BOT_API_PORT: ${API_PORT:-8889}
      BOT_API_WORKERS: ${BOT_API_WORKERS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:-}
      API_BYPASS_AUTH: ${API_BYPASS_AUTH:-false}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8889}:8889"
    volumes:
      - ./bot:/app
    command: >
      sh -c "pip install -q -r requirements.txt &&
      python -m uvicorn src.api.server:app --host 0.0.0.0 --port 8889 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dydx-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 2.00

  worker:
    build:
      context: ./bot
      dockerfile: docker/Dockerfile
      target: development
    container_name: dydx-worker
    restart: unless-stopped
    user: "0:0"
    working_dir: /app/src
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dydx_bot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      DB_NAME: ${POSTGRES_DB:-dydx_bot}
      SECRET_KEY: ${SECRET_KEY:-change-me-jwt-secret-min-32-chars}
      JWT_SECRET_KEY: ${SECRET_KEY:-change-me-jwt-secret-min-32-chars}
      REDIS_ENABLED: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      IS_TESTNET: ${IS_TESTNET:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DYDX_TESTNET_ADDRESS: ${DYDX_TESTNET_ADDRESS:-}
      DYDX_TESTNET_MNEMONIC: ${DYDX_TESTNET_MNEMONIC:-}
      DYDX_MAINNET_ADDRESS: ${DYDX_MAINNET_ADDRESS:-}
      DYDX_MAINNET_MNEMONIC: ${DYDX_MAINNET_MNEMONIC:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:-}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./bot:/app
    command: >
      sh -c "mkdir -p /app/src/pair_history /app/bot_states &&
      pip install -q -r /app/requirements.txt &&
      python main_instance.py --instance-id worker-default"
    healthcheck:
      disable: true
    networks:
      - dydx-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 2.00

  frontend:
    image: node:20-alpine
    container_name: dydx-frontend-dev
    working_dir: /app
    environment:
      VITE_API_URL: http://api:8889
      NODE_ENV: development
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - dydx-network
    profiles: ["dev"]
    mem_limit: 1g
    cpus: 1.00

  frontend-prod:
    image: node:20-alpine
    container_name: dydx-frontend-prod
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8889}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "4173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules-prod:/app/node_modules
    command: >
      sh -c "npm install --include=dev && npm run build && NODE_ENV=production npm run preview -- --host 0.0.0.0 --port 4173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4173', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dydx-network
    profiles: ["prod"]
    mem_limit: 1g
    cpus: 1.00

  proxy:
    image: nginx:1.27-alpine
    container_name: dydx-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/stack.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dydx-network
    profiles: ["prod"]
    mem_limit: 256m
    cpus: 0.50

networks:
  dydx-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
  frontend-node-modules-prod:
