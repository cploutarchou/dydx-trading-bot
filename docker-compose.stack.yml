name: dydx-trading-bot

services:
  postgres:
    image: postgres:15-alpine
    container_name: dydx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dydx_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-dydx_bot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dydx_bot} -d ${POSTGRES_DB:-dydx_bot}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dydx-network
    mem_limit: 512m
    cpus: 0.50

  redis:
    image: redis:7-alpine
    container_name: dydx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dydx-network
    mem_limit: 256m
    cpus: 0.50

  api:
    build:
      context: ./bot
      dockerfile: docker/Dockerfile
      target: development
    container_name: dydx-api
    restart: unless-stopped
    working_dir: /app
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dydx_bot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      DB_NAME: ${POSTGRES_DB:-dydx_bot}
      REDIS_ENABLED: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_BYPASS_AUTH: ${API_BYPASS_AUTH:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-env}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8889}:8889"
    volumes:
      - ./bot:/app
    command: >
      sh -c "pip install -q -r requirements.txt &&
      python -m uvicorn src.api.server:app --host 0.0.0.0 --port 8889 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dydx-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 2.00

  frontend:
    image: node:20-alpine
    container_name: dydx-frontend-dev
    working_dir: /app
    environment:
      VITE_API_URL: http://api:8889
      NODE_ENV: development
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - dydx-network
    profiles: ["dev"]
    mem_limit: 1g
    cpus: 1.00

  frontend-prod:
    image: node:20-alpine
    container_name: dydx-frontend-prod
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8889}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "4173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules-prod:/app/node_modules
    command: >
      sh -c "npm install --include=dev && npm run build && NODE_ENV=production npm run preview -- --host 0.0.0.0 --port 4173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4173', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dydx-network
    profiles: ["prod"]
    mem_limit: 1g
    cpus: 1.00

  proxy:
    image: nginx:1.27-alpine
    container_name: dydx-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/stack.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dydx-network
    profiles: ["prod"]
    mem_limit: 256m
    cpus: 0.50

networks:
  dydx-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
  frontend-node-modules-prod:
