---
# Full integration stack for local development
# Run this with: make stack-up-dev
# Use for Option 2: Full stack integration testing (production-like)
#
# Services:
#   - frontend (5173): React dashboard
#   - backend-api (8888): Go API gateway
#   - bot-api (8889): Python bot control plane
#   - bot-worker: Python trading worker
#   - postgresql (5432): Main database
#   - valkey (6379): Redis-compatible cache
#   - nats (4222): Event/command bus
#   - clickhouse (8123): Analytics database
#   - minio (9010/9011): Object storage

services:
  # ============================================================================
  # DATA LAYER (matching k8s-next infrastructure)
  # ============================================================================

  postgresql:
    image: postgres:16-alpine
    container_name: dydx-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-dydx_bot}
      POSTGRES_USER: ${DATABASE_USER:-dydx_bot}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-dydx_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-stack

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: dydx-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-stack

  nats:
    image: nats:2.10-alpine
    container_name: dydx-nats
    restart: unless-stopped
    command:
      - -js
      - -m
      - "8222"
      - -sd
      - /data
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-stack

  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: dydx-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dydx_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-stack

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: dydx-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    command:
      - server
      - /data
      - --console-address
      - :9011
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-stack

  # ============================================================================
  # APPLICATION LAYER (frontend + APIs + workers)
  # ============================================================================

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8888
        VITE_APP_PORTAL_TYPE: client
    image: dydx-trading-bot/frontend:dev
    container_name: dydx-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-stack

  backend-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: dydx-trading-bot/backend:dev
    container_name: dydx-backend-api
    restart: unless-stopped
    environment:
      # Database
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgresql
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-dydx_bot}
      DATABASE_USER: ${DATABASE_USER:-dydx_bot}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me-postgres}
      # Cache
      REDIS_ENABLED: "true"
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_DB: 0
      # NATS
      NATS_ENABLED: "true"
      NATS_URL: nats://nats:4222
      NATS_STREAM_PREFIX: bot
      # Bot API
      BOT_API_URL: http://bot-api:8889
      BOT_API_TOKEN: ${BOT_API_TOKEN:-local-dev-token}
      # Server
      API_PORT: 8888
      API_HOST: 0.0.0.0
      APP_CONFIG_ENV: development
    ports:
      - "8888:8888"
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-stack

  bot-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: dydx-trading-bot/bot-api:dev
    container_name: dydx-bot-api
    restart: unless-stopped
    environment:
      # Database
      BOT_DB_TYPE: postgres
      BOT_DB_HOST: postgresql
      BOT_DB_PORT: 5432
      BOT_DB_NAME: ${DATABASE_NAME:-dydx_bot}
      BOT_DB_USER: ${DATABASE_USER:-dydx_bot}
      BOT_DB_PASSWORD: ${DATABASE_PASSWORD:-change-me-postgres}
      # Cache
      REDIS_ENABLED: "true"
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_DB: 0
      # NATS
      NATS_ENABLED: "true"
      NATS_URL: nats://nats:4222
      NATS_STREAM_PREFIX: bot
      # ClickHouse
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-dydx_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
      # MinIO
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: dydx-artifacts
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      # Bot
      BOT_API_HOST: 0.0.0.0
      BOT_API_PORT: 8889
      BOT_API_RELOAD: "false"
      APP_CONFIG_ENV: development
    ports:
      - "8889:8889"
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dydx-stack

  bot-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: dydx-trading-bot/bot-worker:dev
    container_name: dydx-bot-worker
    restart: unless-stopped
    environment:
      # Database
      BOT_DB_TYPE: postgres
      BOT_DB_HOST: postgresql
      BOT_DB_PORT: 5432
      BOT_DB_NAME: ${DATABASE_NAME:-dydx_bot}
      BOT_DB_USER: ${DATABASE_USER:-dydx_bot}
      BOT_DB_PASSWORD: ${DATABASE_PASSWORD:-change-me-postgres}
      # Cache
      REDIS_ENABLED: "true"
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_DB: 0
      # NATS
      NATS_ENABLED: "true"
      NATS_URL: nats://nats:4222
      NATS_STREAM_PREFIX: bot
      # ClickHouse
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-dydx_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
      # MinIO
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: dydx-artifacts
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      # Celery
      CELERY_BROKER_URL: redis://valkey:6379/1
      CELERY_RESULT_BACKEND: redis://valkey:6379/2
      # Worker
      APP_CONFIG_ENV: development
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      bot-api:
        condition: service_healthy
    networks:
      - dydx-stack

networks:
  dydx-stack:
    driver: bridge
    name: dydx-stack

volumes:
  postgresql_data:
    driver: local
  valkey_data:
    driver: local
  nats_data:
    driver: local
  clickhouse_data:
    driver: local
  minio_data:
    driver: local
