global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 10s
  timeout client 1m
  timeout server 1m

frontend postgres_front
  bind *:5040
  default_backend postgres_back

backend postgres_back
  option tcp-check
  server postgres postgres:5432 check

frontend redis_front
  bind *:5045
  default_backend redis_back

backend redis_back
  option tcp-check
  server redis redis:6379 check
