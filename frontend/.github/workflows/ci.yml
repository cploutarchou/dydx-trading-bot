name: Frontend CI/CD

on:
    push:
        branches: [main, master, develop]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend*.yml"
    pull_request:
        branches: [main, master, develop]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend*.yml"

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: "frontend/package-lock.json"

            - name: Install dependencies
              run: npm ci
              working-directory: frontend

            - name: Run ESLint
              run: npm run lint
              working-directory: frontend

            - name: Run TypeScript typecheck
              run: npm run typecheck
              working-directory: frontend

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: "frontend/package-lock.json"

            - name: Install dependencies
              run: npm ci
              working-directory: frontend

            - name: Run contract guard tests
              run: npm run test:contracts
              working-directory: frontend

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: "frontend/package-lock.json"

            - name: Install dependencies
              run: npm ci
              working-directory: frontend

            - name: Build
              run: npm run build
              working-directory: frontend

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-build
                  path: frontend/dist
