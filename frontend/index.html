<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO: Base meta tags (overridden by page-specific SEOHead component) -->
    <meta
      name="description"
      content="Technical execution lab for building, testing, and operating dYdX trading bots with research-backed strategies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExecutionLab" />
    <meta property="og:image" content="https://executionlab.io/og-images/default.png" />
    <meta property="og:image:alt" content="ExecutionLab - Technical execution platform" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@executionlab" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://executionlab.io/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <script src="/executionlab-config.js"></script>
    <script>
      (() => {
        const isTheme = (value) => value === 'light' || value === 'dark' || value === 'system';
        let stored = null;
        let legacy = null;
        try {
          stored = localStorage.getItem('ui.theme');
          legacy = localStorage.getItem('ui.publicTheme');
        } catch {
          stored = null;
          legacy = null;
        }
        const preference = isTheme(stored) ? stored : isTheme(legacy) ? legacy : 'system';
        const systemTheme =
          window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        const resolved = preference === 'system' ? systemTheme : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        if (new URLSearchParams(window.location.search).has('qa_screenshots')) {
          document.documentElement.dataset.qaScreenshots = '1';
        }
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <!-- Page-specific title set by SEOHead component or defaults to "ExecutionLab" -->
    <title>ExecutionLab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
