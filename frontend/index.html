<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="ExecutionLab is a modern technical execution lab for building, testing, automating, and shipping production-grade systems."
    />
    <script src="/executionlab-config.js"></script>
    <script>
      (() => {
        const isTheme = (value) => value === 'light' || value === 'dark' || value === 'system';
        let stored = null;
        let legacy = null;
        try {
          stored = localStorage.getItem('ui.theme');
          legacy = localStorage.getItem('ui.publicTheme');
        } catch {
          stored = null;
          legacy = null;
        }
        const preference = isTheme(stored) ? stored : isTheme(legacy) ? legacy : 'system';
        const systemTheme =
          window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        const resolved = preference === 'system' ? systemTheme : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        if (new URLSearchParams(window.location.search).has('qa_screenshots')) {
          document.documentElement.dataset.qaScreenshots = '1';
        }
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <title>ExecutionLab | Build. Test. Execute.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
