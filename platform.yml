apps:
    # ── Python bot API ────────────────────────────────────────────────────────
    # Internal only; the Go backend proxies all frontend traffic to this service.
    # static_port binds container port 8889 to the same host port so other
    # services can reach it at api.service.consul:8889 via Consul DNS.
    - name: api
      type: python
      image: ghcr.io/cploutarchou/dydx-trading-bot/api:latest
      port: 8889
      static_port: true
      health: /health
      replicas: 1
      cpu: 500
      memory: 512
      expose: internal
      path: bot
      env:
          BOT_API_HOST: "0.0.0.0"
          BOT_API_PORT: "8889"
          BOT_API_RELOAD: "false"
          BOT_API_WORKERS: "1"
          LOG_LEVEL: "INFO"
          BOT_DB_TYPE: "postgresql"
          BOT_DB_CUTOVER_MODE: "shared"
          BOT_DB_HOST: "81.17.103.31"
          BOT_DB_PORT: "5432"
          BOT_DB_NAME: "dydx_bot"
          BOT_DB_USER: "dydx_bot"
          DB_TYPE: "postgresql"
          DB_HOST: "81.17.103.31"
          DB_PORT: "5432"
          DB_NAME: "dydx_bot"
          DB_USER: "dydx_bot"
          POSTGRES_HOST: "81.17.103.31"
          POSTGRES_PORT: "5432"
          POSTGRES_DB: "dydx_bot"
          POSTGRES_USER: "dydx_bot"
          REDIS_ENABLED: "true"
          REDIS_HOST: "81.17.103.31"
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          REDIS_SSL: "false"
          REDIS_TIMEOUT: "5"
          BACKTEST_WORKER_BACKEND: "celery"
          LOKI_ENABLED: "true"
          LOKI_URL: "http://81.17.102.165:3100"
          LOKI_LABELS: "{\"app\":\"dydx-api\",\"env\":\"prod\"}"
          IS_TESTNET: "true"
          APP_ENV: "prod"
          ENVIRONMENT: "prod"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "1"
          BOT_API_USE_SERVICE_TOKEN: "true"
          API_BYPASS_AUTH: "false"
          FRONTEND_URL: "https://app.cydevcloud.com"
      secrets:
          # Pulled at runtime from Nomad Variables at nomad/jobs/api
          BOT_DB_PASSWORD: ""
          DB_PASSWORD: ""
          POSTGRES_PASSWORD: ""
          REDIS_PASSWORD: ""
          JWT_SECRET_KEY: ""
          SECRET_KEY: ""
          ENCRYPTION_KEY: ""
          BOT_API_TOKEN: ""

    # ── Go backend (public API gateway) ──────────────────────────────────────
    # The only service the frontend talks to directly.  Authenticates requests,
    # proxies to the Python bot API, and owns the app-level DB schema.
    - name: backend
      type: go
      image: ghcr.io/cploutarchou/dydx-trading-bot/backend:latest
      port: 8888
      static_port: true
      health: /health
      replicas: 1
      cpu: 300
      memory: 256
      expose: public
      host: api.cydevcloud.com
      path: backend
      env:
          API_PORT: "8888"
          ENVIRONMENT: "prod"
          APP_ENV: "prod"
          APP_CONFIG_ENV: "production"
          CORS_ALLOWED_ORIGINS: "https://app.cydevcloud.com"
          # Upstream Python bot API via Consul DNS service discovery
          BOT_API_URL: "http://81.17.102.165:8889"
          BOT_API_TIMEOUT_SECONDS: "120"
          # Backend's own PostgreSQL connection (same shared cluster, same DB for now)
          DB_TYPE: "postgresql"
          DB_HOST: "81.17.103.31"
          DB_PORT: "5432"
          DB_NAME: "dydx_bot"
          DB_USER: "dydx_bot"
          POSTGRES_HOST: "81.17.103.31"
          POSTGRES_PORT: "5432"
          POSTGRES_DB: "dydx_bot"
          POSTGRES_USER: "dydx_bot"
          BOT_DB_HOST: "81.17.103.31"
          BOT_DB_PORT: "5432"
          BOT_DB_NAME: "dydx_bot"
          BOT_DB_CUTOVER_MODE: "shared"
          # Redis
          REDIS_ENABLED: "true"
          REDIS_HOST: "81.17.103.31"
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          REDIS_SSL: "false"
          REDIS_TIMEOUT: "5"
          # Loki
          LOKI_ENABLED: "true"
          LOKI_URL: "http://81.17.102.165:3100"
          LOKI_LABELS: "{\"app\":\"dydx-backend\",\"env\":\"prod\"}"
          # JWT / auth
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "1"
          SESSION_TTL_HOURS: "24"
          AUTH_REQUIRE_REDIS_SESSIONS: "true"
          IS_TESTNET: "false"
      secrets:
          # Pulled at runtime from Nomad Variables at nomad/jobs/backend
          DB_PASSWORD: ""
          POSTGRES_PASSWORD: ""
          REDIS_PASSWORD: ""
          JWT_SECRET_KEY: ""
          SECRET_KEY: ""
          ENCRYPTION_KEY: ""
          BOT_API_TOKEN: ""

    # ── Python worker (background trading engine) ────────────────────────────
    - name: worker
      type: worker
      image: ghcr.io/cploutarchou/dydx-trading-bot/worker:latest
      replicas: 1
      cpu: 500
      memory: 512
      expose: internal
      path: bot
      env:
          LOG_LEVEL: "INFO"
          BOT_DB_TYPE: "postgresql"
          BOT_DB_CUTOVER_MODE: "shared"
          BOT_DB_HOST: "81.17.103.31"
          BOT_DB_PORT: "5432"
          BOT_DB_NAME: "dydx_bot"
          BOT_DB_USER: "dydx_bot"
          DB_TYPE: "postgresql"
          DB_HOST: "81.17.103.31"
          DB_PORT: "5432"
          DB_NAME: "dydx_bot"
          DB_USER: "dydx_bot"
          POSTGRES_HOST: "81.17.103.31"
          POSTGRES_PORT: "5432"
          POSTGRES_DB: "dydx_bot"
          POSTGRES_USER: "dydx_bot"
          REDIS_ENABLED: "true"
          REDIS_HOST: "81.17.103.31"
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          REDIS_SSL: "false"
          REDIS_TIMEOUT: "5"
          BACKTEST_WORKER_BACKEND: "celery"
          WORKER_MODE: "celery-backtest"
          CELERY_CONCURRENCY: "1"
          CELERY_QUEUES: "celery"
          LOKI_ENABLED: "true"
          LOKI_URL: "http://81.17.102.165:3100"
          LOKI_LABELS: "{\"app\":\"dydx-worker\",\"env\":\"prod\"}"
          IS_TESTNET: "true"
          DYDX_TESTNET_NODE_URL: "test-dydx-grpc.kingnodes.com"
          APP_ENV: "prod"
          ENVIRONMENT: "prod"
      secrets:
          # Pulled at runtime from Nomad Variables at nomad/jobs/worker
          BOT_DB_PASSWORD: ""
          DB_PASSWORD: ""
          POSTGRES_PASSWORD: ""
          REDIS_PASSWORD: ""
          JWT_SECRET_KEY: ""
          SECRET_KEY: ""
          ENCRYPTION_KEY: ""
          BOT_API_TOKEN: ""

    # ── React frontend ────────────────────────────────────────────────────────
    - name: frontend
      type: react
      image: ghcr.io/cploutarchou/dydx-trading-bot/frontend:latest
      port: 80
      health: /
      replicas: 1
      cpu: 300
      memory: 128
      expose: public
      host: app.cydevcloud.com
      path: frontend
      auth:
          basic:
              users_env: FRONTEND_BASIC_AUTH
      env:
          VITE_API_URL: "https://api.cydevcloud.com"
          VITE_FORCE_MOCK_DATA: "false"
