[pytest]
# Test discovery configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore problematic test files in root and app/
norecursedirs = 
    .git
    .venv
    __pycache__
    *.egg-info
    node_modules
    .pytest_cache

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests

# Async test support
asyncio_mode = auto

# Minimum Python version
minversion = 7.0

# Show extra test summary info
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage options (if pytest-cov installed)
# --cov=app
# --cov=backend
# --cov-report=html
# --cov-report=term-missing

