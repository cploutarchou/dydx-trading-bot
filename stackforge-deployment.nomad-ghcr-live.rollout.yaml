name: dydx-trading-bot
services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${APP_DB_NAME:-app}
      MARIADB_USER: ${APP_DB_USER:-app}
      MARIADB_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${APP_DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u${APP_DB_USER:-app} -p${APP_DB_PASSWORD:-change-me} --silent
      interval: 10s
      timeout: 5s
      retries: 10
  bot-mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${BOT_DB_NAME:-bot}
      MARIADB_USER: ${BOT_DB_USER:-bot}
      MARIADB_PASSWORD: ${BOT_DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${BOT_DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - bot_mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u${BOT_DB_USER:-bot} -p${BOT_DB_PASSWORD:-change-me} --silent
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 10
  bot:
    image: ghcr.io/cploutarchou/dydx-trading-bot/api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      bot-mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_CONFIG_ENV: ${APP_CONFIG_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-replace-me-strong-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-me-strong-jwt-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-replace-me-strong-encryption-key}
      DB_TYPE: mysql
      BOT_DB_TYPE: mysql
      BOT_DB_CUTOVER_MODE: dedicated
      BOT_API_TOKEN: ${ENCRYPTION_KEY:-replace-me-strong-encryption-key}
      BOT_DB_HOST: bot-mariadb
      BOT_DB_PORT: 3306
      BOT_DB_NAME: ${BOT_DB_NAME:-bot}
      BOT_DB_USER: ${BOT_DB_USER:-bot}
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "8889"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8889/ready')"
          >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
  backend:
    image: ghcr.io/cploutarchou/dydx-trading-bot/backend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_CONFIG_ENV: ${APP_CONFIG_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PORT: 8888
      SECRET_KEY: ${SECRET_KEY:-replace-me-strong-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-me-strong-jwt-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-replace-me-strong-encryption-key}
      FRONTEND_URL: https://${APP_DOMAIN:-app.executionlab.io}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:-app.executionlab.io}
      DB_TYPE: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${APP_DB_NAME:-app}
      DB_USER: ${APP_DB_USER:-app}
      DB_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BOT_API_URL: http://bot:8889
      BOT_API_USE_SERVICE_TOKEN: "true"
      BOT_API_TOKEN: ${ENCRYPTION_KEY:-replace-me-strong-encryption-key}
      BOT_DB_CUTOVER_MODE: dedicated
      BOT_DB_HOST: bot-mariadb
      BOT_DB_PORT: 3306
      BOT_DB_NAME: ${BOT_DB_NAME:-bot}
      BOT_DB_USER: ${BOT_DB_USER:-bot}
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:-change-me}
      STACKFORGE_ROLLOUT_NONCE: 20260531T220515Z
    ports:
      - 8888:8888
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8888/ready >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
  frontend:
    image: ghcr.io/cploutarchou/dydx-trading-bot/frontend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.executionlab.io}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.executionlab.io}
        VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-https://api.executionlab.io}
        VITE_CLIENT_HOST: ${VITE_CLIENT_HOST:-app.executionlab.io}
        VITE_CRM_HOST: ${VITE_CRM_HOST:-crm.executionlab.io}
        VITE_IB_PORTAL_HOST: ${VITE_IB_PORTAL_HOST:-ib.executionlab.io}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 5173:80
volumes:
  mariadb_data: null
  bot_mariadb_data: null
  redis_data: null
