name: my-stackforge-app

auto_dns:
  enabled: true
  app_domain: app.example.com
  api_domain: api.example.com
  domains:
    - admin.example.com
  zone_id: ""
  proxied: true

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-app}
      POSTGRES_USER: ${APP_DB_USER:-app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${APP_DB_USER:-app} -d ${APP_DB_NAME:-app}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/cploutarchou/dydx-trading-bot}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_CONFIG_ENV: ${APP_CONFIG_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-replace-me-strong-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-me-strong-jwt-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-replace-me-strong-encryption-key}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${APP_DB_NAME:-app}
      DB_USER: ${APP_DB_USER:-app}
      DB_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BOT_API_HOST: 0.0.0.0
      BOT_API_PORT: 8889
    ports:
      - "8889:8889"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8889/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/cploutarchou/dydx-trading-bot}/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_CONFIG_ENV: ${APP_CONFIG_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-replace-me-strong-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-me-strong-jwt-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-replace-me-strong-encryption-key}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${APP_DB_NAME:-app}
      DB_USER: ${APP_DB_USER:-app}
      DB_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/cploutarchou/dydx-trading-bot}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_CONFIG_ENV: ${APP_CONFIG_ENV:-production}
      API_PORT: 8888
      SECRET_KEY: ${SECRET_KEY:-replace-me-strong-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-me-strong-jwt-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-replace-me-strong-encryption-key}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${APP_DB_NAME:-app}
      DB_USER: ${APP_DB_USER:-app}
      DB_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BOT_API_URL: http://api:8889
      FRONTEND_URL: ${FRONTEND_URL:-https://app.example.com}
    ports:
      - "8888:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8888/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/cploutarchou/dydx-trading-bot}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
