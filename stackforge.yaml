# StackForge cluster config for dydx-trading-bot
# Canonical repo config aligned with the live stackforge-cluster production state.

cluster:
  name: stackforge-cluster
  environment: production
  datacenter: dc1

ssh:
  user: root
  port: 22
  private_key_path: ~/.ssh/id_ed25519
  copy_public_key: true

nodes:
  - name: nomad-cp-01
    address: 10.0.0.11
    public_address: 159.195.82.201
    roles:
      - consul-server
      - nomad-server
      - nomad-client
      - traefik
      - database
      - control-plane

network:
  private_interface: eth1
  public_interface: eth0
  allowed_admin_cidrs:
    - 212.32.18.42/32
    - 66.92.130.49/32
    - 87.228.189.174/32
  allowed_ssh_cidrs:
    - 212.32.18.42/32
    - 66.92.130.49/32
    - 87.228.189.174/32
  allow_public_internal_communication: false

consul:
  version: latest-stable
  acl_enabled: true
  encrypt_gossip: true
  ui_enabled: true

nomad:
  version: latest-stable
  acl_enabled: true
  ui_enabled: true
  client_enabled: true

traefik:
  version: latest-stable
  entrypoints:
    web: 80
    websecure: 443
  cert_resolver: letsencrypt
  email: support@cpdevlabs.com
  dashboard_enabled: true
  dashboard_domain: traefik.cpdevlabs.com
  dashboard_basic_auth: true

database:
  engine: mariadb
  mode: single
  backup_enabled: true
  backup_schedule: "0 3 * * *"

control_plane:
  domain: cpdevlabs.com
  api_port: 8080
  admin_api_keys:
    - b79f2c6dc035ac2febe470e86b67fdf07da1499653233e0e60665244ed4d0211
  reconciler_enabled: true
  reconciler_interval_seconds: 300

cloudflare:
  api_token_env: CLOUDFLARE_API_TOKEN
  default_zone_id: ""
