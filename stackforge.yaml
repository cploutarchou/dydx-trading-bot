# StackForge cluster config for dydx-trading-bot
# Generated scaffold: replace TODO values before any live production action.
# Note for existing clusters: effective runtime values may already be provisioned in
# ~/.stackforge/stackforge-cluster/ (inventory/domain-pool/generated-secrets).
# Treat those live state files as source-of-truth for day-2 operations and verification.

cluster:
  name: stackforge-cluster
  environment: production
  datacenter: dc1

ssh:
  user: root
  port: 22
  private_key_path: ~/.ssh/id_ed25519
  copy_public_key: true

nodes:
  - name: nomad-cp-01
    # TODO: Set private RFC1918 address for internal traffic
    address: 10.0.0.11
    # TODO: Set public node address/hostname used for SSH/bootstrap
    public_address: 159.195.82.201
    roles:
      - consul-server
      - nomad-server
      - nomad-client
      - traefik
      - database
      - control-plane

network:
  # TODO: Set actual interface names for your hosts
  private_interface: eth1
  public_interface: eth0
  # TODO: Restrict to operator/VPN/admin CIDRs
  allowed_admin_cidrs:
    - 10.0.0.0/24
  # TODO: Restrict SSH source ranges; avoid public-all CIDRs
  allowed_ssh_cidrs:
    - 10.0.0.0/24
  allow_public_internal_communication: false

consul:
  version: latest-stable
  acl_enabled: true
  encrypt_gossip: true
  ui_enabled: true

nomad:
  version: latest-stable
  acl_enabled: true
  ui_enabled: true
  client_enabled: true

traefik:
  version: latest-stable
  entrypoints:
    web: 80
    websecure: 443
  cert_resolver: letsencrypt
  # TODO: set operator email for ACME
  email: ops@your-domain.com
  dashboard_enabled: true
  # TODO: set real dashboard domain
  dashboard_domain: traefik.your-domain.com
  dashboard_basic_auth: true

database:
  engine: postgres
  mode: single
  backup_enabled: true
  backup_schedule: "0 3 * * *"

control_plane:
  # TODO: set real control-plane domain
  domain: control.your-domain.com
  api_port: 8080
  admin_api_keys:
    - set-a-real-admin-api-key-before-live
  reconciler_enabled: true
  reconciler_interval_seconds: 300

cloudflare:
  api_token_env: CLOUDFLARE_API_TOKEN
  default_zone_id: ""
