global
    log stdout format raw local0
    maxconn 20000

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend redis_front
    bind *:6379
    default_backend redis_nodes

backend redis_nodes
    option tcp-check
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    # Primary first, replicas as automatic backups.
    # Sentinel promotes replicas when the primary is down.
    server redis1 dydx-redis-ha_redis-node-1:6379 check
    server redis2 dydx-redis-ha_redis-node-2:6379 check backup
    server redis3 dydx-redis-ha_redis-node-3:6379 check backup
