services:
  pgpool:
    image: bitnamilegacy/postgresql:latest
    environment:
      POSTGRESQL_POSTGRES_PASSWORD_FILE: /run/secrets/pg_su_password
      POSTGRESQL_USERNAME: dydx_bot
      POSTGRESQL_PASSWORD_FILE: /run/secrets/pg_app_password
      POSTGRESQL_DATABASE: dydx_bot
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: ingress
    networks:
      internal:
        aliases:
          - pgpool
          - postgres
    volumes:
      - postgres_data:/bitnami/postgresql
    secrets:
      - pg_su_password
      - pg_app_password
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U dydx_bot -d dydx_bot"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  internal:
    external: true

volumes:
  postgres_data:

secrets:
  pg_su_password:
    external: true
  pg_app_password:
    external: true
