services:
  pgpool:
    image: bitnamilegacy/postgresql:latest
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      POSTGRESQL_USERNAME: dydx_bot
      POSTGRESQL_DATABASE: dydx_bot
    networks:
      internal:
        aliases:
          - pgpool
          - postgres
    volumes:
      - postgres_data:/bitnami/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U dydx_bot -d dydx_bot"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  internal:
    external: true

volumes:
  postgres_data:
